# Part 3 of AGENTS.md: the numerical statements F1, FB1 and N1 to N6 (N7 is excluded; see consistency.yaml,
# item "numerics quotations"). Run 2026-11-22_claude-opus-5-5. Check counts are those of the final report
# verification/2026-11-22_claude-opus-5-5/numerical_checks.md (93 of 93 passed). Paths relative to the repository root.

- id: F1
  holds: "yes"
  checks: {direct: "9/9 passed", supporting: "8/8 passed"}
  assessment: >-
    The direct checks recompute the four panels of Figure 1 from the port of the authors' MATLAB price game
    (finite menu {2, 4}, caption parameters), require a unique first-period pure equilibrium and a unique
    second-period price pair at every feasible sales state, confirm the inventory equilibria, the payoff matrices and
    the second-period price equilibria from the model primitives, and compare the plotted profits with the points read
    back from paper/figure1.eps-figure4.eps. Rounded to 4 decimals as drawn, the recomputed profits match the published
    points within the extraction error bounds (largest deviations 2.2e-6, 1.6e-5, 1.8e-6, 1.0e-5 against bounds 2.72e-6,
    1.65e-5, 1.92e-6, 1.46e-5 for panels a-d); a fresh extraction equals the stored data byte for byte and uses only
    tick labels. All 352 first-period inventory equilibria behind the 44 points hold in the model (largest deviation
    gain 2.8e-14) and every price equilibrium is strict (deviation loss at least 0.84), so the figure does not depend on
    tolerances or selection. Equilibrium prices: N plays (4,4,4,4) at all points; S plays (4,4,4,4) at gamma = 0.7 and
    (2,2,4,4) at gamma = 2.
  own_checks:
    - "verification/2026-11-22_claude-opus-5-5/scripts/F1_price_game_details.py"
    - "verification/2026-11-22_claude-opus-5-5/scripts/F1_inventory_equilibria_all_points.py"
  findings: []

- id: FB1
  holds: "yes"
  checks: {direct: "5/5 passed", supporting: "4/4 passed"}
  assessment: >-
    The direct checks compare the port with the authors' MATLAB values (numerics/matlab/Figure2_MATLAB/Figure2_reference.csv,
    99 of 99 values equal to 15 significant digits) and with the four published panels (yaG, ybG, piaG, pibG; largest
    difference 3.5e-6, within the extraction bounds). The supporting checks confirm the Lemma B.1 orders and the
    mixed-scenario profits from the model. At every caption point the Lemma B.1 branch applies and all fractiles lie in
    [0, 1]. The plotted profits are two-period totals at exogenous prices, as the caption's parameters imply.
  findings: []

- id: N1
  holds: "yes"
  checks: {direct: "1/1 passed", supporting: "1/1 passed"}
  assessment: >-
    test_split_ratios_are_constant_over_time_in_figure_1 requires the equilibrium shares of the two periods to be exactly
    equal at all 44 points and both scenarios, and at least one price to change between periods; prices change at 22 of
    88 point-scenario cases. This is the sentence's content for the plotted experiments. The shares are constant because
    every equilibrium is symmetric within a period (alpha = 1/2), which the sentence does not say but does not contradict.
  findings: []

