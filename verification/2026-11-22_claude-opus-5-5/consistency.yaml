- item: numerics quotations
  compared_with: numerics/numerical_statements.yaml and the LaTeX quotations in numerics/tests/test_port_matches_paper.py, against paper/Manuscript.tex and paper/OnlineAppendix.tex in context
  method: script
  result: consistent
  note: >-
    All nine quotes of numerical_statements.yaml occur verbatim (references resolved with numerics/paper_labels.json)
    and read correctly in context; the 13 LaTeX strings quoted in test_port_matches_paper.py match the lemmas and
    equations they transcribe; test_figures.py and test_other_distributions.py contain paraphrases only. The reason for
    excluding N7 is true: Appendix B adopts the finite-menu setting of Section 5.3 for the mixed scenarios, and
    pricing.py, section5.py, find_general_exo and the Figure2_MATLAB code cover only S and N with prices, or exogenous
    prices; the paper gives no gamma for "large enough". The Introduction's and Conclusion's sentences on numerical
    findings, and the lead sentences of Section 5.3 and of Appendix B's robustness paragraph, restate N2-N5 and need no
    entry. One sentence of the discussion after Proposition 5 is not listed (finding C1).
  findings:
    - id: C1
      severity: editorial
      scope: numerics
      locator: "numerics/numerical_statements.yaml, header ('Every numerical statement of the paper has an entry'); paper/Manuscript.tex line 310"
      description: >-
        The file omits the sentence "However, when strong cross-brand C2C is present, we find that $\Pi^N_{A}$ may
        decrease in $\theta$ when $\theta$ takes intermediate values." No proposition or figure states it, so it is a
        finding about the model that the repository neither lists nor checks. It sits in the discussion around
        Proposition 5, which AGENTS.md places out of scope, and it holds.
      suggested_fix: Add an entry for the sentence (with a check, for example the probe below), or mark it with a field excluded that says it is discussion text.
      evidence: >-
        scripts/part1_omitted_statement_probe.py: at 286 of 1800 admissible Section 4 points (gamma in {5, 20, 100}),
        Pi^N_A from the closed form strictly decreases on an interior theta interval; at the printed example the model
        (section4.Game, exact uniform integration) gives Pi^N_A = 7581.732395 at theta = 0.16 and 7579.185261 at 0.99.

- item: numerics predicates of the checks
  compared_with: the statements of the 16 results and of F1, FB1, N1-N6, check by check (numerics/tests/)
  method: reading
  result: consistent
  note: >-
    Each result record assesses the predicates of its checks (proofs/<ID>.yaml, numerical.assessment): strictness,
    quantifiers, retailer, scenario and period match, and where a check is stronger than the statement (strict
    monotonicity outside the equality cases, interior crossings, extra pattern conditions in the N2 and N5 checks) the
    stronger property is true and the check passes. Threshold parts are probed at very large gamma only, as the
    docstrings say. One labelling slip (finding C2).
  findings:
    - id: C2
      severity: editorial
      scope: numerics
      locator: "numerics/tests/test_port_matches_paper.py: test_branch_conditions_in_the_code_are_the_fractile_orderings, test_scenario_s_code_matches_lemma_2, test_scenario_n_code_matches_lemma_3, test_mixed_scenario_code_matches_lemma_b1, test_mixed_scenario_reduces_to_scenarios_s_and_n"
      description: >-
        Five checks are marked claims("L2.first"), claims("L3.first") or claims("LB1.first"), that is, as direct tests
        that the stated orders are an equilibrium. They compare the port with a transcription of the lemma or with other
        code and do not test the equilibrium property, so they are supporting checks. The direct counts of L2 and L3
        (8 each) and of LB1 (6) each include two such checks. The equilibrium property itself is tested directly by
        test_first_period_equilibrium[S|N|G] and the fixed-point scans, which pass, so no conclusion changes.
      suggested_fix: Mark the five checks with pytest.mark.supports instead of pytest.mark.claims.
      evidence: The docstrings and bodies of the five checks (criterion - equality of code outputs with the transcription, or of two code paths, at 25 rational points).
