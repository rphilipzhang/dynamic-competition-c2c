restatement: >-
  For every admissible point of Section 4 (A1, A10, A11, I1, I2), every theta in [0, 1] and every gamma > 0, with
  the equilibrium orders of Lemmas 1 to 3: (a) for t = 1, 2, y^0_{A,t}/alpha_{A,t} >= y^0_{B,t}/alpha_{B,t};
  (b) for k in {S, N}, y^k_{A,1}/alpha_{A,1} >= y^k_{B,1}/alpha_{B,1}, and for every first-period sales state,
  (y^k_{A,2} - Z^k_{A,2})/alpha_{A,2} >= (y^k_{B,2} - Z^k_{B,2})/alpha_{B,2}, where Z^k_{i,2} is the C2C-induced
  demand at that state. Weak inequalities; equality occurs in (a) exactly when A11 binds in period t and in the
  first period of S exactly when A11 binds in both periods, and never in the first period of N.
