steps:
  - id: 1
    locator: 'By Lemma 1 and Lemma 2, for k = 0, S, y^k_{A,1} = \alpha_{A,1} \zeta^k_{A,1} + \theta \alpha_{B,1} (\zeta^k_{A,1} - \zeta^k_{B,1})'
    claim: The benchmark and Scenario S orders of A are affine in theta with slope alpha_{B,1}(zeta_A - zeta_B) >= 0.
    status: verified
    method: symbolic
    note: >-
      Identity checked from the closed forms; second theta-derivative is 0. With r_i = 1 - F(zeta_i), the slope is
      2 sigma alpha_{B,1}(r_B - r_A); (r^0_B - r^0_A) p_{A,1} p_{B,1} = X1 := c_B p_{A,1} - c_A p_{B,1} >= 0 and
      (r^S_B - r^S_A) P_S Q_S = X1 + gamma X2 >= 0 (X2 := c_B p_{A,2} - c_A p_{B,2}), both by A11. This also
      confirms the editorial Interpretation paragraph (slope zero exactly when A11 binds in period 1, resp. in both periods).
  - id: 2
    locator: '\frac{\partial y^{N}_{A,1}}{\partial \theta} = \alpha_{B,1} (\zeta^N_{A,1} - \zeta^N_{B,1}) - \theta \alpha_{B,1} \frac{\partial \zeta^N_{B,1}}{\partial \theta}'
    claim: Derivative of y^N_{A,1} in theta (zeta^N_A does not depend on theta).
    status: verified
    method: symbolic
    note: Checked by SymPy from the Lemma 3 closed form.
  - id: 3
    locator: '(A.18)'
    claim: d zeta^N_B/d theta = -(1/f(zeta^N_B)) d/dtheta of the critical ratio.
    status: verified
    method: symbolic
    note: Inverse-function rule; under A10 f = 1/(2 sigma) on the support and zeta^N_B lies in it (fractile in (0,1)). Checked symbolically.
  - id: 4
    locator: '(A.19) One can check ... \geq 0'
    claim: The critical ratio of B in Scenario N is nondecreasing in theta.
    status: verified
    method: symbolic
    note: >-
      My derivation: d r^N_B/d theta = alpha_{B,2} gamma m_B (X1 + gamma W) / (P_N D_N^2), with m_B = p_{B,2} - c_B,
      P_N = p_{A,1} + alpha_{A,2} gamma m_A, D_N = p_{B,1} + alpha_{B,2} gamma (1 - theta) m_B and
      W = alpha_{A,2} c_B m_A - alpha_{B,2} c_A m_B = alpha_{A,2} X2 + (alpha_{A,2} - alpha_{B,2}) c_A m_B. W > 0:
      if X2 > 0 the first term is positive; if X2 = 0 then p_{A,2} < p_{B,2} (A1), so alpha_{A,2} > alpha_{B,2}.
      Hence (A.19) holds strictly for gamma > 0 (the numerator does not depend on theta).
  - id: 5
    locator: 'Thus, \frac{\partial y^N_{A,1}}{\partial \theta} \geq 0'
    claim: y^N_{A,1} is nondecreasing in theta.
    status: verified
    method: re-derivation
    note: Both terms of step 2 are nonnegative; the first is positive since r^N_B(theta) >= r^N_B(0) > r^N_A ((r_B(0) - r_A) has numerator X1 + gamma W > 0), so y^N_{A,1} is strictly increasing.
  - id: 6
    locator: 'if \theta = 0, we have y^N_{A,1} - y^S_{A,1} = -\frac{2 \alpha_{A,1} \alpha_{B,2} \gamma c_A \sigma (p_{A,2}-c_A)}{...} < 0'
    claim: Value of the order difference at theta = 0, negative for gamma > 0.
    status: verified
    method: symbolic
    note: SymPy identity with the printed expression; every factor is positive.
  - id: 7
    locator: 'If \theta = 1, ... g_A^{SN}(\gamma) is quadratic ... \frac{\partial^2 g_A^{SN}(\gamma)}{\partial \gamma^2} = ... >0'
    claim: At theta = 1 the difference is a positive factor times a quadratic g_A^SN with positive second derivative, so it is positive for large gamma.
    status: verified
    method: symbolic
    note: >-
      (y^N - y^S)|_{theta=1} p_{B,1} P_S Q_S P_N / (2 gamma sigma) is a polynomial of degree 2 in gamma; its second
      derivative equals the printed expression, whose inner bracket equals -W, so it is 2 alpha_{B,1} m_A m_B W > 0.
      The prefactor 2 gamma sigma / (p_{B,1} P_S Q_S P_N) is positive. The constant term can be negative, so for small
      gamma the difference at theta = 1 can be negative (probe: A11 binding in both periods, gamma = 0.1), consistent with "when gamma is large".
  - id: 8
    locator: 'direct differentiation of the closed form in Lemma 3 gives \frac{\partial^2 y_{A,1}^N}{\partial \theta^2}\geq 0'
    claim: y^N_{A,1} is convex in theta; y^S_{A,1} is affine, so y^N - y^S is convex.
    status: verified
    method: symbolic
    note: My derivation, checked by SymPy - d2 y^N_{A,1}/d theta2 = 4 sigma alpha_{B,1} N / D_N^2 + 4 sigma theta alpha_{B,1} alpha_{B,2} gamma m_B N / D_N^3 with N = alpha_{B,2} gamma m_B (X1 + gamma W)/P_N > 0.
  - id: 9
    locator: 'By the above arguments, there exists \theta^{SN}\in(0,1)'
    claim: Single crossing of the convex difference, negative at 0 and positive at 1.
    status: verified
    method: re-derivation
    note: The sublevel set of thetas with y^N - y^S <= 0 of the continuous convex difference is a closed interval containing 0 and not 1, so it is [0, theta^SN] with theta^SN in (0,1), and the difference is positive on (theta^SN, 1]. This gives the printed claim with theta^SN in [0,1].
