restatement: >-
  Under A1 to A11, I1 and I2 (uniform seed demand on [mu - sigma, mu + sigma], rho = 1, exogenous prices with
  p_{B,t} >= p_{A,t} >= (c_A/c_B) p_{B,t}): (i) for every admissible market and every gamma > 0, each of
  y^0_{A,1}, y^S_{A,1} and y^N_{A,1} is nondecreasing in theta on [0, 1] (y^0_{A,2} likewise); (ii) for every
  admissible market there is a gamma* (it may depend on prices, costs, beta and sigma, not on theta) such that
  for every gamma >= gamma* there is a theta^SN in [0, 1] (it may depend on gamma and the market) with
  y^S_{A,1} >= y^N_{A,1} on [0, theta^SN] and y^S_{A,1} <= y^N_{A,1} on [theta^SN, 1].
