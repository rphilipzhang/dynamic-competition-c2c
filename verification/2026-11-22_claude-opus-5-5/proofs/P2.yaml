id: P2
run_id: 2026-11-22_claude-opus-5-5
auditor: {model: claude-opus-5-5, harness: Claude Code, date: "2026-11-22", prior_exposure: "Orchestrator session context listed one-line memory notes that an earlier verification run of this repository exists; no earlier audit, other verification folder or file outside the repository root was read."}
verdict: sound
paper_statement: holds_as_printed
confidence: high
restatement: >-
  Under A1 to A11, I1 and I2, for every admissible market and every gamma > 0: (a) y^N_{B,1} is nonincreasing in
  theta on [0, 1], and y^0_{B,1}, y^S_{B,1} do not depend on theta; (b) for every theta in [0, 1],
  y^0_{B,1} < y^N_{B,1} < y^S_{B,1}; (c) for every theta in [0, 1), the map gamma -> y^S_{B,1} - y^N_{B,1} on
  (0, infinity) is increasing up to some gamma_peak(theta, market) and decreasing after it.
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, I1, I2]
unstated_hypotheses: []
relies_on: ["P1 proof, displays (A.18) and (A.19)"]
steps:
  - id: 1
    locator: '(a) By Lemmas 1&2, y^{0}_{B,1} = \alpha_{B,1} \zeta^0_{B,1} and y^{S}_{B,1} = \alpha_{B,1} \zeta^S_{B,1} are both independent of \theta'
    claim: The benchmark and Scenario S orders of B do not contain theta.
    status: verified
    method: symbolic
    note: Theta-derivatives are identically 0.
  - id: 2
    locator: 'By (A.18) and (A.19), we have \frac{\partial y^{N}_{B,1}}{\partial \theta} = \alpha_{B,1} \frac{\partial \zeta^N_{B,1}}{\partial \theta} \leq 0'
    claim: y^N_{B,1} is nonincreasing in theta.
    status: verified
    method: symbolic
    note: d y^N_{B,1}/d theta = -2 sigma alpha_{B,1} alpha_{B,2} gamma m_B (X1 + gamma W)/(P_N D_N^2) < 0 for gamma > 0 (W > 0, see P1 record, step 4). The cited (A.18), (A.19) are verified in the P1 record.
  - id: 3
    locator: '(b) ... holds if and only if (A.20)'
    claim: The ordering of the orders is equivalent to the reverse ordering of the critical ratios.
    status: verified
    method: symbolic
    note: In all three scenarios y_B = alpha_{B,1}(mu + sigma - 2 sigma r_B) with alpha_{B,1} > 0 (I2), strictly decreasing in r_B.
  - id: 4
    locator: 'By (A.19), we have \frac{c_B - \rho \alpha_{B,2} \gamma (p_{B,2}-c_B) ...}{p_{B,1} } \geq ... \geq \frac{c_B }{p_{B,1} + \rho \alpha_{B,2} \gamma (p_{B,2} -c_B)}'
    claim: r^N_B(theta) lies between its values at theta = 0 and theta = 1.
    status: verified
    method: symbolic
    note: The two outer expressions are exactly r^N_B(1) and r^N_B(0) (SymPy), and r^N_B is nondecreasing by (A.19).
  - id: 5
    locator: 'Furthermore, since \frac{c_B }{p_{B,1} } > ... and ... > \frac{c_B}{p_{B,1} + \rho \gamma (p_{B,2} -c_B)}'
    claim: Strict outer inequalities, so (A.20) holds for all theta.
    status: verified
    method: symbolic
    note: The differences are alpha_{B,2} gamma m_B c_A/(P_N p_{B,1}) > 0 and c_B alpha_{A,2} gamma m_B/((p_{B,1} + alpha_{B,2} gamma m_B) Q_S) > 0 (alpha_{A,2} > 0 by I2).
  - id: 6
    locator: '(c) ... \frac{\partial }{\partial \gamma}( y^{S}_{B,1} - y^{N}_{B,1} ) = 2(p_{B,2}-c_B)\alpha_{B,1} \sigma g_B^{SN}(\gamma)/[...]'
    claim: The gamma-derivative of the gap is a positive factor times a quartic g_B^SN.
    status: verified
    method: symbolic
    note: >-
      The printed denominator equals Q_S^2 P_N^2 D_N^2 (symbolic). With gap = 2 sigma alpha_{B,1}(n_N/(P_N D_N) - c_B/Q_S),
      g_B^SN = (n_N' P_N D_N Q_S^2 - n_N (P_N D_N)' Q_S^2 + c_B m_B P_N^2 D_N^2)/m_B is a polynomial of degree 4
      (exact division by m_B, symbolic); the displayed identity was also confirmed in exact rational arithmetic at
      200 random points.
  - id: 7
    locator: 'a^{SN}_4 \leq 0, a^{SN}_3 \leq 0, a^{SN}_1 \geq 0, and a^{SN}_0 \geq 0'
    claim: Signs of four coefficients of g_B^SN.
    status: verified
    method: symbolic
    note: >-
      My derivation, each identity checked by SymPy: a4 = -alpha_{A,2} alpha_{B,2} m_A m_B^2 (1-theta) E1,
      a3 = -2 alpha_{A,2} alpha_{B,2} m_A m_B^2 (1-theta) E0, a1 = 2 p_{A,1} p_{B,1}^2 E1, a0 = p_{A,1} p_{B,1}^2 E0, with
      E1 = alpha_{A,2}^2 c_B m_A (1-theta) + theta W > 0 and E0 = alpha_{A,2} c_B p_{A,1} + theta alpha_{B,2} X1 > 0.
      For theta < 1 all four are strict, so the sign sequence is (-, -, a2, +, +) with exactly one change whatever a2 is.
  - id: 8
    locator: 'For \theta<1, the difference ... is positive by (b) and tends to zero as \gamma\downarrow0 and \gamma\to\infty'
    claim: Boundary behaviour of the gap.
    status: verified
    method: symbolic
    note: The gap is 0 at gamma = 0 and tends to 0 as gamma -> infinity for theta < 1 (substitution gamma = 1/eps, eps -> 0); at theta = 1 the limit is a positive constant, which is why the statement excludes theta = 1.
  - id: 9
    locator: 'Its interior maximum gives a positive root of g_B^{SN}(\gamma), unique by Descartes'' Rule of Signs.'
    claim: The derivative changes sign once, from positive to negative.
    status: verified
    method: re-derivation
    note: One sign change gives exactly one positive root, counted with multiplicity, hence simple; g(0) = a0 > 0 and the leading coefficient a4 < 0, so the gap rises before the root and falls after it. Existence of the root also follows from a0 > 0 > a4 without the limit argument.
