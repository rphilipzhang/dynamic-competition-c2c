steps:
  - id: 1
    locator: '(A.4)'
    claim: The second-period payoff of A, written in the shifted decision ybar_{A,2} = y_{A,2} - gamma R_{A,1}, is the benchmark payoff in (ybar_A, ybar_B) plus (p_{A,2} - c_A) gamma R_{A,1}.
    status: verified
    method: re-derivation
    note: y_{A,2} - D_{A,2} = ybar_A - alpha_{A,2} X_2 - theta (alpha_{B,2} X_2 - ybar_B)^+, so the leftover is the benchmark leftover. Derivation mine.
  - id: 2
    locator: 'Note that the profit function in (A.4) is concave in $\overline{y}_{A,2}$'
    claim: Concavity and best response (A.5), by the argument of Lemma 1.
    status: verified
    method: re-derivation
    note: >-
      The demand in shifted variables is the benchmark demand, so (A.1) and (A.2) apply. The feasible set becomes
      ybar_A >= -gamma R_{A,1}; for ybar_A < 0 the derivative is p - c > 0, and for ybar_B < 0 Prob(D_A <= ybar_A) =
      F(u), the first branch of (A.5), so the best response is unchanged (derivation mine).
  - id: 3
    locator: '(A.6)'
    claim: The same for retailer B, with best response (A.7).
    status: verified
    method: re-derivation
    note: Mirror of steps 1 and 2.
  - id: 4
    locator: 'By combining (A.5) and (A.7), there exists a unique Nash equilibrium in the second period'
    claim: The shifted second-period game has the unique equilibrium ybar = y^0_{.,2}, so y^S_{i,2} = y^0_{i,2} + gamma R_{i,1}.
    status: verified
    method: symbolic
    note: Lemma 1 at the second-period prices, which satisfy A11 (C7 of shared_exact_identities.py covers the intersection for every zeta_A >= zeta_B). Holds at every sales state, as a feedback equilibrium requires.
  - id: 5
    locator: 'retailer A''s second-period profit equals $\pi^{0}_{A,2} + (p_{A,2} -c_A)\gamma \mathbb{E} \left[ R_{A,1} | X_1 \right]$'
    claim: Second-period equilibrium profit = pi^0_{i,2} + (p_{i,2} - c_i) gamma R_{i,1}.
    status: verified
    method: symbolic
    note: >-
      Pathwise identity: with y = y^0 + Z and M = alpha X + Z, R_{i,2} = Z_i + R^0_{i,2}(X_2), so the period profit
      is pi^0_{i,2}(X_2) + (p_{i,2} - c_i) Z_i at every X_2 (C9 of shared_exact_identities.py, exact at 12000
      cases). Affine in R_{i,1}, so its expectation needs only E[R_{i,1}].
  - id: 6
    locator: '(A.8)'
    claim: The first-period objective of A is [p_{A,1} - c_A + rho (p_{A,2} - c_A) gamma] y_{A,1} - [p_{A,1} + rho (p_{A,2} - c_A) gamma] E[y_{A,1} - D_{A,1}]^+ + rho pi^0_{A,2}.
    status: verified
    method: re-derivation
    note: Substitutes step 5 into the two-period objective and uses min(D, y) = y - (y - D)^+.
  - id: 7
    locator: 'Note that profit function in (A.8) is concave in $y_{A,1}$'
    claim: Concavity, the derivative, and best response (A.9) with zeta^S_{A,1}.
    status: verified
    method: numerical
    note: >-
      Same structure as Lemma 1 with price p_{A,1} + rho gamma m_A and cost c_A, both positive under I1; derivation
      mine. The derivative matches a central difference of the model payoff (D1 of
      shared_derivatives_best_responses.py, max error 2e-11 relative, both regions).
  - id: 8
    locator: '(A.10)'
    claim: The same for retailer B, best response (A.11).
    status: verified
    method: re-derivation
    note: Mirror of steps 6 and 7.
  - id: 9
    locator: 'Note that $\zeta^S_{i,1} > \zeta^0_{i,1}$ for $\gamma > 0$, when $\rho >0$ and $p_{i,t}>c_i$'
    claim: zeta^S_{i,1} > zeta^0_{i,1}.
    status: verified
    method: re-derivation
    note: c_i/(p_{i,1} + rho gamma m_i) < c_i/p_{i,1} for m_i > 0, and F^{-1} is strictly increasing on (0, 1) under A3. Not used by the statement.
  - id: 10
    locator: 'we have $\frac{c_A}{p_{A,1}+\rho \gamma (p_{A,2}-c_A)} \leq \frac{c_B}{p_{B,1}+\rho \gamma (p_{B,2}-c_B)}$ and thus $\zeta^S_{A,1} \geq \zeta^S_{B,1}$'
    claim: The critical-ratio ordering in Scenario S.
    status: verified
    method: symbolic
    note: >-
      (c_A/c_B)(p_{B,1} + rho gamma (p_{B,2} - c_B)) = (c_A/c_B) p_{B,1} + rho gamma ((c_A/c_B) p_{B,2} - c_A) <=
      p_{A,1} + rho gamma (p_{A,2} - c_A). Exact check C1 at 4000 points: 0 failures, equality exactly when A11
      binds in both periods (150 points).
  - id: 11
    locator: 'By combining (A.9) and (A.11), there exists a unique Nash equilibrium $(y^S_{A,1},y^S_{B,1})$'
    claim: Unique first-period equilibrium at the stated orders.
    status: verified
    method: symbolic
    note: Same piecewise-linear intersection as in Lemma 1 with zeta^S (C7, exact). Uniqueness of the two-period equilibrium follows from uniqueness in each subgame and in period 1.
  - id: 12
    locator: 'Last, by substituting $y^S_{A,1}$ and $y^S_{B,1}$ into (A.8) and (A.10)'
    claim: Pi^S_i, L^S_{i,1}, R^S_{i,1} and the second-period orders as displayed.
    status: verified
    method: re-derivation
    note: L^S_{i,1} = (y^S_{i,1} - D_{i,1})^+ at the equilibrium orders, term by term. Under the uniform law the closed-form sales and profits equal the model's (test_closed_form_sales_and_profits_equal_the_model[S], 500 points).
