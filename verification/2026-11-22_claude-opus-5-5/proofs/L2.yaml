confidence: high
restatement: >-
  Fix any admissible point of Section 4 (as in L1: A11, I1, I2, theta in [0, 1]), any gamma > 0, rho = 1 in the
  displayed formula (the proof holds for every rho in (0, 1]; rho and gamma enter only through rho gamma), and
  any F of the A3 class. Under within-brand C2C (Z_{i,2} = gamma R_{i,1}) and feedback (subgame-perfect)
  play: (second) for every first-period sales state (R_{A,1}, R_{B,1}) >= 0 the second-period game has exactly
  one equilibrium, y^S_{i,2} = y^0_{i,2} + gamma R_{i,1}, with y^0_{i,2} of Lemma 1 at the second-period prices;
  (first) given that continuation, the first-period game has exactly one equilibrium, y^S_{A,1} = (alpha_{A,1} +
  theta alpha_{B,1}) zeta^S_{A,1} - theta alpha_{B,1} zeta^S_{B,1} and y^S_{B,1} = alpha_{B,1} zeta^S_{B,1}, with
  zeta^S_{i,1} = F^{-1}(1 - c_i/(p_{i,1} + gamma (p_{i,2} - c_i))); (unique) the two-period feedback equilibrium is
  therefore unique; (profits) total profits Pi^S_i, leftovers L^S_{i,1} and sales R^S_{i,1} are those displayed at
  the end of the proof.
differences_checked: []
hypotheses_used: [A2, A3, A4, A5, A7, A8, A9, A10, A11, I1, I2]
unstated_hypotheses: []
relies_on:
  - "L1 proof: (A.1) and the derivation of the best responses (A.2), (A.3), invoked as 'by analogous arguments in the proof of Lemma 1'"
