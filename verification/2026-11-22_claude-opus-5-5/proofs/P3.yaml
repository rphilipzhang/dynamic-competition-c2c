    P3.a requires, at gamma = 1e50 and 1e60, E[R^N_A] strictly increasing, E[R^S_A] strictly increasing or exactly
    constant where A11 binds in both periods, and d = E[R^S_A] - E[R^N_A] with d(0) > 0, d(1) < 0 and pattern "+-";
    at every gamma of the ladder it requires d(0) > 0 and pattern "+" or "+-". This matches the printed predicate
    (the strict "<" region and the allowed cutoff at 1) and the scenario, retailer and period. P3.b requires strict
    decrease of E[R^N_B], exact constancy of E[R^S_B] and E[R^N_B] < E[R^S_B] at every node and gamma. Supporting
    checks tie the closed-form sales to the model's sales.
