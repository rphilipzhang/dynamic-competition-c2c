restatement: >-
  Fix any admissible point of Section 4: 0 < c_A < c_B, prices with p_{B,t} >= p_{A,t} >= (c_A/c_B) p_{B,t}
  and p_{i,t} > c_i (A11, I1), beta > 0 with both shares alpha_{i,t} in (0, 1) (I2), theta in [0, 1], and any
  seed-demand distribution F with interval support in [0, infinity) and a strictly positive density on its
  interior (A3). Without C2C interactions the two periods decouple. For each period t in {1, 2}, the
  single-period game in which each retailer i chooses y_{i,t} >= 0 to maximize p_{i,t} E[min(D_{i,t}, y_{i,t})]
  - c_i y_{i,t}, with D_{i,t} = alpha_{i,t} X_t + theta (alpha_{j,t} X_t - y_{j,t})^+, has exactly one Nash
  equilibrium in order quantities, namely y^0_{A,t} = (alpha_{A,t} + theta alpha_{B,t}) zeta^0_{A,t} - theta
  alpha_{B,t} zeta^0_{B,t} and y^0_{B,t} = alpha_{B,t} zeta^0_{B,t}, with zeta^0_{i,t} = F^{-1}(1 - c_i/p_{i,t}).
differences_checked: []
hypotheses_used: [A2, A3, A4, A7, A8, A9, A11, I1, I2]
unstated_hypotheses: []
