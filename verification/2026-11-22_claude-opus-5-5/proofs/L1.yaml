steps:
  - id: 1
    locator: 'retailer A maximizes its single-period profit in each period $t$'
    claim: Without C2C the continuation does not depend on period-1 orders, so each period is a static game; p E[y min D] - c y = (p - c) y - p E[y - D]^+.
    status: verified
    method: re-derivation
    note: min(D, y) = y - (y - D)^+. With Z = 0 no state links the periods, so the feedback equilibrium is the pair of period equilibria (A8, A9). Derivation mine.
  - id: 2
    locator: 'Retailer A''s profit is concave in $y_{A,t}$ and its derivative'
    claim: The payoff is concave with derivative p_{A,t} - c_A - p_{A,t} Prob(D_{A,t} <= y_{A,t}).
    status: verified
    method: re-derivation
    note: >-
      D_A is a continuous, strictly increasing, piecewise-linear function of X (slopes alpha_A and alpha_A +
      theta alpha_B), so it has no atom; d/dy E[y - D]^+ = Prob(D <= y), which is nondecreasing in y, hence
      concavity. Derivation mine. The Scenario S version of this derivative, which reduces to it at gamma = 0,
      matches a central difference of the model payoff (D1 of shared_derivatives_best_responses.py).
  - id: 3
    locator: '(A.1)'
    claim: Prob(D_A <= y_A) = int_0^{y_B/alpha_B} 1{z <= y_A/alpha_A} f + int_{y_B/alpha_B}^infty 1{z <= (y_A + theta y_B)/(alpha_A + theta alpha_B)} f.
    status: verified
    method: re-derivation
    note: For X <= y_B/alpha_B, D_A = alpha_A X; for X > y_B/alpha_B, D_A = (alpha_A + theta alpha_B) X - theta y_B. The lower limit 0 uses X >= 0, which holds by the meaning of the model (seed demand), not a new hypothesis.
  - id: 4
    locator: 'If $y_{A,t}/\alpha_{A,t} \geq y_{B,t}/\alpha_{B,t}$, $\frac{y_{B,t}}{\alpha_{B,t}} \leq'
    claim: The case split; u = (y_A + theta y_B)/(alpha_A + theta alpha_B) lies between y_B/alpha_B and y_A/alpha_A, so Prob = F(u) if y_A/alpha_A >= y_B/alpha_B and F(y_A/alpha_A) otherwise.
    status: verified
    method: re-derivation
    note: u is the average of a = y_A/alpha_A and b = y_B/alpha_B with weights alpha_A > 0 and theta alpha_B >= 0, so u in [b, a] or u in [a, b), strictly below b in the second case.
  - id: 5
    locator: '(A.2)'
    claim: Retailer A's best response is the stated two-branch function with zeta^0_{A,t} = F^{-1}(1 - c_A/p_{A,t}).
    status: verified
    method: re-derivation
    note: >-
      Derivation mine: the derivative is p - c > 0 at y = 0+ (F(0) = 0 as the support lies in [0, infinity)) and
      tends to -c < 0, so the maximizer is interior and solves the first-order condition; F is strictly increasing
      at levels in (0, 1) under A3, so the root is unique (F(u) = q_A gives u = zeta_A; branch 1 lies in its region
      iff y_B <= alpha_B zeta_A). Single-valued best responses.
  - id: 6
    locator: 'By analogous arguments, the best response of retailer B is'
    claim: (A.3), the mirror of (A.2).
    status: verified
    method: re-derivation
    note: Same derivation with the roles of A and B exchanged.
  - id: 7
    locator: 'Since $p_{B,t} c_A/c_B \leq p_{A,t}$, we have $\zeta^0_{A,t} \geq \zeta^0_{B,t}$'
    claim: A11 gives c_A/p_{A,t} <= c_B/p_{B,t}, hence zeta^0_A >= zeta^0_B.
    status: verified
    method: re-derivation
    note: Only the lower bound of A11 is used. Equality iff A11 binds in period t (C8 of shared_exact_identities.py). A1 is not used by any inference; A11 is nonempty only if c_A <= c_B.
  - id: 8
    locator: 'By combining (A.2) and (A.3), for each period $t$, there exists a unique Nash equilibrium'
    claim: With zeta_A >= zeta_B the two best responses intersect exactly once, at the stated pair.
    status: verified
    method: symbolic
    note: >-
      Exact enumeration of the four branch pairs of the piecewise-linear best responses at 4000 rational points
      with zeta_A >= zeta_B, including zeta_A = zeta_B, theta = 0 and theta = 1 (C7 of
      shared_exact_identities.py): exactly one consistent solution, the claimed one. Equivalent region argument:
      in y_A/alpha_A < y_B/alpha_B the first-order conditions would give y_A/alpha_A = zeta_A and
      w = (y_B + theta y_A)/(alpha_B + theta alpha_A) = zeta_B with w > y_A/alpha_A, contradicting zeta_A >= zeta_B.
      The step needs only F^{-1} strictly increasing, so it holds for every F of the A3 class.
  - id: 9
    locator: 'Last, by substituting $y^0_{A,t}$ and $y^0_{B,t}$ into retailers'' profit functions'
    claim: pi^0_{i,t} = (p_{i,t} - c_i) y^0_{i,t} - p_{i,t} E[L^0_{i,t}] with the displayed leftovers L^0, and R^0 = y^0 - L^0.
    status: verified
    method: re-derivation
    note: L^0_{i,t} = (y^0_{i,t} - D_{i,t})^+ written out at the equilibrium orders; the two displayed expressions match term by term.
