numerical:
  command: python numerics/run.py -k P5
  direct: "4/4 passed"
  supporting: "7/7 passed"
  assessment: >-
    P5.a requires Pi^S_A strictly increasing, or exactly constant where A11 binds in both periods, at gamma = 1e50 and
    1e60; P5.b requires both strict inequalities at every theta node; P5.c1 uses the points with unequal shares
    (compared exactly) and the strict inequalities of the right direction. P5.c2 takes points with equal shares and
    E < 0, i.e. c_B > c_B-bar, which is the union over admissible choices of Delta^A of the statement's condition, and
    requires d(0) > 0, d(1) < 0 and pattern "+-" at the two top rungs, at 90 further qualifying points as well; the
    expression E used for the selection is the correct sign of the leading coefficient (step 9). With zeros skipped, a
    zero inside the strict region would not be detected, which is a nongeneric event here. The supporting check on
    gamma^A_4 documents the cost dependence that the fixed-market interpretation allows. All checks concern retailer A,
    the right scenarios and the two-period totals. Threshold parts are probed only at very large gamma.
  own_checks:
    - "verification/2026-11-22_claude-opus-5-5/scripts/P5_symbolic_checks.py: every listed identity True. Fixed-market probes with equal shares and c_B > c_B-bar (symmetric prices c_B = 3, c_B-bar = 2.75; price gap c_B = 2.9, c_B-bar = 2.746; c_B = 2.76 just above c_B-bar = 2.75): sign pattern '+-' with one root in [0,1] once gamma is large enough (from gamma = 10, 1000 and 1000 respectively), the root approaching 1 as gamma grows; markets below c_B-bar show '+' (statement silent)."
    - "verification/2026-11-22_claude-opus-5-5/scripts/shared_sec4_counterexample_search.py: 0 violations of P5.a at 160 exact random admissible markets with boundaries and gamma from 0.001 to 1000."
not_checked:
