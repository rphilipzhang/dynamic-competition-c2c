restatement: >-
  Under A1 to A11, I1 and I2, fix an admissible market (prices, costs, beta, mu, sigma). There is gamma^A > 0
  (depending on the market, not on theta) such that for every gamma >= gamma^A: (a) Pi^S_A is nondecreasing in theta
  on [0, 1]; (b) Pi^S_A > Pi^0_A and Pi^N_A > Pi^0_A for every theta in [0, 1]; (c1) if alpha_{A,1} < alpha_{A,2}
  then Pi^S_A < Pi^N_A for every theta, and if alpha_{A,1} > alpha_{A,2} then Pi^S_A > Pi^N_A for every theta;
  (c2) fixed-market interpretation of AGENTS.md - there is a cost cutoff Delta^A > 0 (it may depend on c_A, the
  prices and beta) such that, if alpha_{A,1} = alpha_{A,2} and Delta c >= Delta^A, then for every gamma >= gamma^A
  (gamma^A may now depend on the costs) there is theta^A in [0, 1] (depending on gamma and the market) with
  Pi^S_A >= Pi^N_A on [0, theta^A] and Pi^S_A < Pi^N_A on (theta^A, 1].
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, I1, I2]
unstated_hypotheses: []
