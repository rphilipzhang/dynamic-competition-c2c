    claim: Error equations.
    status: verified
    method: symbolic
    note: Subtracting the linear system at (u^0, v^0) from (A.21). Both errors are O(gamma^-2); hence z - z^0 = O(gamma^-3) and s - s^0 = O(gamma^-2 / (1 + gamma(1-theta))), so the order errors are O(gamma^-2) uniformly in theta (order 2 at theta = 1, 3 for fixed theta < 1, as the LA2.a check records).
  - id: 38
    locator: 'permits implicit differentiation and shows that these terms remain O_{C^2(p_1;P)}(γ^{-2})'
    claim: The remainders of the order expansions are O(gamma^-2) together with their first two price derivatives, uniformly in theta.
    status: verified
    method: re-derivation
    note: My derivation - delta w = -J(p)^{-1} E(w(p), p); D_p J has entries 1/gamma and 1/(1+gamma(1-theta)); D_p w = -(J + D_w E)^{-1}(D_p J w + D_p E) is bounded; differentiating twice and using step 34 gives D_p delta w, D_p^2 delta w = O(gamma^-2). P8 relies on this bound.
  - id: 39
    locator: 'Π_i^N(p_{A,1},p_{B,1}) = γν_iμ + K_i(θ) + α_{i,1}(μp_{i,1} - c_i(μ+σ)) + O_{C^2(p_1;P)}(γ^{-1}), for each fixed θ < 1'
    claim: Expansion of the reduced first-period payoff, used by P9.
    status: verified
    method: symbolic
    note: >-
      My derivation, with exact identities checked by SymPy and against section5.expected_sales (error 3e-16):
      E R_1 = mu - sigma [q^2 + (1-theta) alpha_B (t^2 - q^2)], E R_A = alpha_A mu - (alpha_A+theta alpha_B) sigma q^2
      + theta alpha_B sigma t^2, E R_B = alpha_B (mu - sigma t^2). With q = O_{C^2}(1/gamma) and, for fixed
      theta < 1, t = O_{C^2}(1/gamma), every correction (including gamma nu_i sigma q^2, gamma nu_i (1-theta) t^2 and
      E e_i(R_1)) is O_{C^2}(1/gamma) with constants depending on 1/(1-theta). The restriction to fixed theta < 1 is
      necessary: at gamma(1-theta) of order one, t is of order one. scripts/P9_payoff_expansion_and_price_path.py:
      at theta = 0.5 the spread of the residual over a price patch times gamma is 11.6, 12.6, 12.7 for
      gamma = 1e2, 1e3, 1e4 and second differences shrink faster; at theta = 1 - 1/gamma the spread stays near 0.40.
