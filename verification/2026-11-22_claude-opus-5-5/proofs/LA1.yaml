restatement: >-
  Section 5 model (A1-A10 with rho = 1 and X uniform on [mu - sigma, mu + sigma], A12, A13, I1), Scenario S.
  (a) There is gamma_0 < infinity, depending only on (c_A, c_B, beta, mu, sigma, p_lo, p_hi), such that for
  every gamma >= gamma_0, every theta in [0, 1] and every first-period price pair (p_{A,1}, p_{B,1}) in
  P = [p_lo, p_hi]^2, the first-period inventory subgame (with the equilibrium continuation of period 2)
  has exactly one pure Nash equilibrium, namely y_A = (alpha_A + theta alpha_B) zeta_A - theta alpha_B zeta_B,
  y_B = alpha_B zeta_B with zeta_i = F^{-1}(1 - c_i / (p_{i,1} + gamma (p_hi - c_i))).
  (b) For every pair of first-period sales R_{A,1} > 0, R_{B,1} > 0 there is gamma_1 (depending on the sales)
  such that for every gamma >= gamma_1 the second-period price game has the unique equilibrium (p_hi, p_hi);
  and for every gamma > 0, every second-period price pair and every sales state, the second-period inventory
  subgame has the unique equilibrium y_{i,2} = y^0_{i,2} + gamma R_{i,1}, with y^0 the benchmark equilibrium
  of Lemma 1 for whichever retailer has the higher fractile.
