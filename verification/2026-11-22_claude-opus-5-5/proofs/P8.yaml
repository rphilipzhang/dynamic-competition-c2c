restatement: >-
  Section 5 model (A1-A10, A12, A13, A14, I1); y^k_{i,1}(p_{A,1}, p_{B,1}) is the unique first-period inventory
  equilibrium of LA1/LA2. (a) There is gamma^A, uniform in theta in [0, 1], such that for gamma > gamma^A, on all
  of P, y^S_{i,1} is strictly decreasing in p_{i,1} and strictly increasing in p_{j,1}, i = A, B.
  (b1) There is gamma^B, uniform in theta in [0, 1], such that for gamma > gamma^B, on P, y^N_{A,1} is strictly
  decreasing and y^N_{B,1} strictly increasing in p_{A,1}. (b2) If (A.22) holds, there exist a nonempty open set U
  of interior price pairs (a neighbourhood of any pair satisfying (A.23)) and constants l^D > 0, gamma^D < infinity
  such that for every gamma > gamma^D and every theta with 0 <= gamma (1 - theta) <= l^D, on U, y^N_{A,1} is
  strictly decreasing and y^N_{B,1} strictly increasing in p_{B,1}. Moreover, for each fixed theta < 1 there is
  gamma(theta) such that for gamma > gamma(theta), on P, y^N_{A,1} is strictly increasing and y^N_{B,1} strictly
  decreasing in p_{B,1}.
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A12, A13, A14, I1]
unstated_hypotheses: []
relies_on:
  - "LA1-LA2 joint proof (LA1 record, steps 34 and 38): the remainders of the first-period order expansions of LA2(a) are O(gamma^-2) together with their first two derivatives in p_1 on P, uniformly in theta in [0, 1]"
steps:
  - id: 1
    locator: 'Lemma A.1 gives y^S_{i,1} = α_{i,1}(μ+σ) + O_{C^1(p_1;P)}(γ^{-1}), uniformly in θ ∈ [0,1] and first-period prices'
    claim: Expansion of the Scenario S orders with derivative control.
    status: verified
    method: symbolic
    note: The LA1(a) form is exact; SymPy shows gamma times the remainder and gamma times its p_A and p_B derivatives have finite limits, bounded uniformly in theta (theta enters linearly) and in prices (denominators p_{i,1} + gamma (p_hi - c_i) >= gamma (p_hi - c_B)).
  - id: 2
    locator: 'Differentiation yields own- and cross-price derivatives -β(μ+σ)+O(γ^{-1}) and β(μ+σ)+O(γ^{-1})'
    claim: Signs of the Scenario S derivatives for gamma large.
    status: verified
    method: symbolic
    note: d alpha_i/d p_i = -beta, d alpha_i/d p_j = +beta; strict signs once the O(1/gamma) term is below beta (mu + sigma).
  - id: 3
    locator: 'Lemma A.2 gives ∂y^N_{B,1}/∂p_{A,1} = βζ^N_{B,1}+O(γ^{-1}) and ∂y^N_{A,1}/∂p_{A,1} = -β[(1-θ)ζ^N_{A,1}+θζ^N_{B,1}]+O(γ^{-1})'
    claim: (b1) derivative formulas, uniform in theta.
    status: verified
    method: symbolic
    note: >-
      SymPy on the closed form: the residuals are c_A gamma nu_B sigma theta (1 + 2 beta (p_A - p_B))/((gamma nu_A + p_A)^2 (gamma nu_B (theta - 1) - p_B))
      and a similar expression with an O(gamma) numerator; both are O(1/gamma) uniformly in theta because
      |gamma nu_B (theta - 1) - p_B| >= p_lo. The O(gamma^-2) remainder of LA2(a) contributes O(gamma^-2) to the
      derivatives only through the C^1 bound of the joint proof (relies_on).
  - id: 4
    locator: 'For sufficiently large γ, part (b1) holds.'
    claim: Strict signs in (b1).
    status: verified
    method: re-derivation
    note: zeta^N_{A,1}, zeta^N_{B,1} lie in (mu - sigma, mu + sigma) because the fractile arguments lie in (0, 1) (c_B < p_lo and theta gamma nu_B c_A/(p_A + gamma nu_A) < c_A nu_B/nu_A < c_B), so both leading terms are at least beta (mu - sigma) in absolute value.
  - id: 5
    locator: '(A.22) ... It is equivalent to the existence of an interior price pair satisfying (A.23)'
    claim: Equivalence of the condition and the nonempty region.
    status: verified
    method: numerical
    note: K = c_B - c_A nu_B/nu_A > 0 (LA1 step 9); the bound in (A.23) is continuous and strictly increasing in p_{A,1}, with supremum at p_hi not attained, so existence holds iff (A.22). scripts/P8_expansions_and_slopes.py - grid search agrees with (A.22) at 2995 of 2995 random markets (265 satisfy it).
  - id: 6
    locator: '(A.24) ... Such choices exist by the strict inequality in (A.23)'
    claim: Choice of epsilon and l^D.
    status: verified
    method: re-derivation
    note: Continuity of both sides in (epsilon, l^D) at (0, 0).
  - id: 7
    locator: '(A.25), first line; replacing θγν_Bc_A/(p_{A,1}+γν_A) by c_Aν_B/ν_A, with O_{C^1(p_1;P)}(γ^{-1}) error'
    claim: Expansion of y^N_{B,1} when gamma (1 - theta) is bounded.
    status: verified
    method: symbolic
    note: SymPy - with gamma (1 - theta) = l, the replacement error is -c_A nu_B (l nu_A + p_A)/(nu_A (gamma nu_A + p_A)); gamma times it and gamma times its p_A-derivative have finite limits, uniform for l in [0, l^D]. Dividing by p_B + l nu_B >= p_lo keeps the bound.
  - id: 8
    locator: '(A.25), second line; ζ^N_{A,1} = μ+σ+O_{C^1(p_1;P)}(γ^{-1}), and 1-θ = O(γ^{-1})'
    claim: Expansion of total stock.
    status: verified
    method: symbolic
    note: SymPy - at gamma (1 - theta) = l, gamma [y_A + y_B - (mu+sigma)] and gamma times its p_B-derivative converge to finite limits; zeta_B and its derivatives stay bounded.
  - id: 9
    locator: '(A.26)'
    claim: Derivative of the leading term of (A.25) in p_{B,1}.
    status: verified
    method: symbolic
    note: SymPy - d/d p_B of alpha_B [mu+sigma - 2 sigma K/(p_B + l nu_B)] minus the printed leading term of (A.26) simplifies to 0.
  - id: 10
    locator: 'On Ū and for 0 <= γ(1-θ) <= ℓ^D, its leading term is bounded below by ... > 0'
    claim: Uniform positive lower bound of the leading term.
    status: verified
    method: re-derivation
    note: The numerator increases in p_A and l, the denominator increases in p_B and l; positivity is (A.24) squared.
  - id: 11
    locator: 'Thus, for sufficiently large γ, ∂y^N_{B,1}/∂p_{B,1} > 0 uniformly there ... ∂y^N_{A,1}/∂p_{B,1} = -∂y^N_{B,1}/∂p_{B,1}+O(γ^{-1}) < 0'
    claim: Signs in the first part of (b2).
    status: verified
    method: numerical
    note: >-
      Follows from steps 7-10. scripts/P8_expansions_and_slopes.py at a market with (A.22) ratio 1.19, theta = 1:
      model slope d y_B/d p_B = 0.48439, 0.47735, 0.47662 for gamma = 1e2, 1e3, 1e4 against the leading term
      0.47654 (gamma times gap 0.79-0.81), and d y_A/d p_B is its negative. At gamma (1 - theta) = 0.5 the slope is
      already about -0.26: l^D must be small, as (A.24) provides.
  - id: 12
    locator: 'Finally, for any fixed θ<1, Lemma A.2 gives y^N_{i,1} = α_{i,1}(μ+σ)+O_{C^1(p_1;P)}(γ^{-1}) ... threshold may depend on the fixed θ'
    claim: Reversed signs for fixed theta < 1.
    status: verified
    method: re-derivation
    note: For fixed theta < 1, t^0 = O(1/(1 + gamma(1-theta))) with d t^0/d p_B = -t^0/(p_B + gamma(1-theta) nu_B) and d t^0/d p_A = O(1/gamma), so the closed form is alpha_i (mu+sigma) + O_{C^1}(1/gamma) with a constant depending on 1/(1 - theta); the derivatives in p_B tend to -beta (mu+sigma) for B and +beta (mu+sigma) for A.
findings:
  - id: F1
    severity: editorial
    scope: statement
    locator: "Proposition 8(b2): 'There exists an open neighborhood of (p_{A,1}, p_{B,1})'"
    description: >-
      The statement does not say which price pair the neighbourhood surrounds. Read as "for every first-period
      price pair" it would be false; the proof constructs the neighbourhood U around any pair satisfying (A.23),
      which exists by (A.22), and chooses l^D and gamma^D for that U.
    suggested_fix: "Write 'there exist a nonempty open set U of first-period price pairs (a neighbourhood of any pair satisfying (A.23)) and constants l^D > 0, gamma^D < infinity such that, on U, ...'."
    evidence: Steps 5-11; at a fixed pair outside (A.23) the leading term of (A.26) at theta = 1 is -beta (mu+sigma) + sigma K (1 + 2 beta p_A)/p_B^2, which is negative when p_B exceeds the bound of (A.23).
