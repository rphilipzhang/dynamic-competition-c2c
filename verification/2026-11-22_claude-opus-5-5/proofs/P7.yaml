  - "LA1-LA2 joint proof, opening paragraph: the second-period inventory equilibrium y^0_{i,2} + Z_{i,2} for every gamma, every price pair and either fractile ordering (the last sentence of LA1(b) and LA2(b), which needs no large gamma)"
steps:
  - id: 1
    locator: 'Conditional on first-period sales, Lemmas A.1 and A.2 imply that y^S_{i,2} = y^0_{i,2}+γR^S_{i,1} and y^N_{i,2} = y^0_{i,2}+α_{i,2}γR^N_1'
    claim: Second-period orders as functions of second-period prices.
    status: verified
    method: re-derivation
    note: LA1 record step 1; valid for every gamma, which P7 needs since it is stated for every gamma.
  - id: 2
    locator: 'the price comparative statics of y^S_{i,2} are identical to those of the benchmark quantity y^0_{i,2}'
    claim: In Scenario S the C2C term does not depend on second-period prices.
    status: verified
    method: reading
    note: gamma R_{i,1} is fixed given first-period sales.
  - id: 3
    locator: '∂y^N_{i,2}/∂p_{i,2} = ∂y^0_{i,2}/∂p_{i,2} - βγR^N_1 and ∂y^N_{i,2}/∂p_{j,2} = ∂y^0_{i,2}/∂p_{j,2} + βγR^N_1'
    claim: Scenario N shifts the derivatives by a constant.
    status: verified
    method: symbolic
    note: SymPy - d(alpha_A gamma R_1)/d p_A = -beta gamma R_1, d/d p_B = +beta gamma R_1.
  - id: 4
    locator: 'If p_{A,2} <= (c_A/c_B)p_{B,2}, ȳ^S_{A,2} = (1/2+βp_{B,2}-βp_{A,2})(-2c_Aσ/p_{A,2}+μ+σ) and ∂ȳ/∂p_{A,2} = c_Aσ(2βp_{B,2}+1)/p_{A,2}^2 - β(μ+σ)'
    claim: First own-price piece of y^0_A (retailer B has the higher fractile) and its shape.
    status: verified
    method: symbolic
    note: SymPy reproduces the piece and its derivative; the second derivative -2 c_A sigma (1 + 2 beta p_B)/p_A^3 < 0, so the piece is strictly concave and can only decrease, increase then decrease, or increase.
  - id: 5
    locator: 'If p_{A,2} > (c_A/c_B)p_{B,2}, ∂ȳ^S_{A,2}/∂p_{A,2} = -β(μ+σ) + c_Aσ(1+θ+2β(1-θ)p_{B,2})/p_{A,2}^2 + 2βc_Bθσ/p_{B,2}'
    claim: Second own-price piece and its derivative.
    status: verified
    method: symbolic
    note: SymPy reproduces it; second derivative -2 c_A sigma (1 + theta + 2 beta (1-theta) p_B)/p_A^3 < 0 (strictly concave).
  - id: 6
    locator: '∂_{p_{A,2}} ȳ^S_{A,2} <= -β(μ^2 - μσ + σ^2)/(μ+σ) < 0 at p_{A,2} = p_hi'
    claim: The own-price slope is negative at the upper price bound.
    status: verified
    method: numerical
    note: >-
      My derivation: p_hi always lies on the second piece (p_hi > (c_A/c_B) p_B). A12 and A13 give
      p_lo > W := (mu+sigma)(c_A + 2 c_B)/(3 mu) (from p_hi - p_lo < 1/(2 beta) and p_hi > 1/(2 beta) + W) and
      1/p_hi < 2 beta/(1 + x) with x = 2 beta W. The claim is equivalent to
      c_A(1+theta+2 beta(1-theta) p_B)/p_hi^2 + 2 beta theta c_B/p_B <= 3 beta mu/(mu+sigma); both sides are affine
      in theta, and at theta = 0 and theta = 1 it reduces to 2 c_A x (2+x)/(1+x)^2 < c_A + 2 c_B and
      4 c_A x/(1+x)^2 <= c_A, which hold. scripts/P7_derivatives_and_endpoint_bounds.py: adversarial search over
      1.28 million admissible points (theta = 0 and 1 included, p_hi and p_lo pushed to their limits), smallest
      normalised slack 3.6e-7 >= 0; the constant is sharp in the limit c_A -> 0, p_lo -> W, theta = 1.
  - id: 7
    locator: 'Thus, ȳ^S_{A,2} exhibits four possible patterns'
    claim: Two strictly concave pieces joined continuously, ending with a negative slope, give exactly the four listed patterns.
    status: verified
    method: symbolic
    note: SymPy - y^0_A is continuous at the switch and its derivative jumps by c_B sigma theta (c_B - 2 beta p_B (c_B - c_A))/(c_A p_B^2), of either sign; an upward jump allows two interior maxima. Each piece has at most one interior maximum, so at most two; all patterns end decreasing.
  - id: 8
    locator: 'By analogous arguments, ȳ^S_{B,2} exhibits the same patterns.'
    claim: Retailer B's own-price shape.
    status: verified
    method: numerical
    note: >-
      Mirror formulas derived by SymPy: both pieces strictly concave; B's derivative always jumps upward at the
      switch (by c_A sigma theta (c_A + 2 beta p_A (c_B - c_A))/(c_B p_A^2)). Unlike A, p_B = p_hi can lie on
      either piece (B-high when p_A <= (c_A/c_B) p_hi); the endpoint bound holds on both (adversarial search:
      smallest normalised slack 0.0065 away from sigma -> 0; analytic endpoint check as in step 6).
  - id: 9
    locator: 'Therefore, we proved part (a).'
    claim: Part (a) for Scenario N.
    status: verified
    method: re-derivation
    note: My derivation (the text states only the shift of step 3) - subtracting beta gamma R_1 keeps each piece strictly concave, leaves the jump unchanged and makes the end slope more negative, so the same patterns follow.
  - id: 10
    locator: 'If p_{B,2} < (c_B/c_A)p_{A,2}, ∂ȳ^S_{A,2}/∂p_{B,2} = β(-2c_A(1-θ)σ/p_{A,2}+μ+σ) - 2c_Bβθp_{A,2}σ/p_{B,2}^2 - c_Bθσ/p_{B,2}^2'
    claim: First rival-price piece and its shape.
    status: verified
    method: symbolic
    note: SymPy reproduces it; second derivative 2 c_B sigma theta (1 + 2 beta p_A)/p_B^3 >= 0 (convex), so the piece can increase, decrease then increase, or decrease.
  - id: 11
    locator: 'If p_{B,2} >= (c_B/c_A)p_{A,2}, ∂ȳ^S_{A,2}/∂p_{B,2} = β(-2c_Aσ/p_{A,2}+μ+σ) > 0'
    claim: Second rival-price piece increases.
    status: verified
    method: symbolic
    note: Equals beta zeta^0_A >= beta (mu - sigma) > 0.
  - id: 12
    locator: '∂_{p_{B,2}} ȳ^S_{A,2} >= β(μ^2 - μσ + σ^2)/(μ+σ) > 0 at p_{B,2} = p_hi'
    claim: The rival-price slope is positive at the upper price bound.
    status: verified
    method: numerical
    note: >-
      My derivation for both pieces (p_hi lies on the first, convex piece when p_hi < (c_B/c_A) p_A, and that is
      the case in which the bound is needed to exclude a curve that only decreases; the text attaches the bound
      to the second piece, whose slope is positive anyway). First piece, affine in theta: at theta = 0 it reduces
      to 2 c_A < c_A + 2 c_B, at theta = 1 to 2 c_B x (2+x)/(1+x)^2 < c_A + 2 c_B. Second piece: c_A/p_A < mu/(mu+sigma).
      Adversarial search: smallest normalised slack 0.17.
  - id: 13
    locator: 'ȳ^S_{A,2} either increases or first decreases then increases in p_{B,2}. By analogous arguments, ȳ^S_{B,2} either increases or first decreases then increases in p_{A,2}.'
    claim: Part (b) for both retailers in Scenario S.
    status: verified
    method: symbolic
    note: For A in p_B - convex first piece ending with a positive slope if it contains p_hi, then an increasing piece. For B in p_A - convex B-high piece at low p_A (second derivative 2 c_A sigma theta (1 + 2 beta p_B)/p_A^3), then the A-high piece with slope beta zeta^0_B > 0, which always contains p_hi.
  - id: 14
    locator: 'We have proved part (b).'
    claim: Part (b) for Scenario N.
    status: verified
    method: re-derivation
    note: My derivation - adding beta gamma R_1 to the rival-price slope keeps the first piece convex and the slopes at p_hi and on the second piece positive.
