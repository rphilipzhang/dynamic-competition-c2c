restatement: >-
  Section 5 model (A1-A10, A12, A13, I1). For every gamma > 0, every theta in [0, 1], both scenarios k = S, N,
  both retailers i, every fixed first-period sales state, and every rival second-period price p_{j,2} in
  [p_lo, p_hi], consider y^k_{i,2} = y^0_{i,2} + Z^k_{i,2} (the second-period inventory equilibrium) as a function
  of the second-period prices. (a) As a function of p_{i,2} on [p_lo, p_hi] it is either nonincreasing or has
  one or two interior local maxima. (b) For every fixed p_{i,2}, as a function of p_{j,2} on [p_lo, p_hi] it is
  either nondecreasing or first nonincreasing and then nondecreasing.
