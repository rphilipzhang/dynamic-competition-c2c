steps:
  - id: 1
    locator: 'By Lemma 3, we have the closed form of \mathbb{E} [R^{N}_{1}].'
    claim: Closed form of total expected first-period sales.
    status: verified
    method: symbolic
    note: mu - E[R^N_1] = sigma (alpha_{A,1} + theta alpha_{B,1}) r_A^2 + sigma (1 - theta) alpha_{B,1} r_B^2 (SymPy, from the sales formulas checked by integration).
  - id: 2
    locator: '\frac{\partial }{\partial \theta}\mathbb{E} [R^{N}_{1}] = \frac{- \alpha_{B,1} [c_{A} (p_{B,1}-(\alpha_{A,2}-1) \gamma p_{B,2})-c_{B} (...)] \sigma}{(...)^2 (...)^3} g^{N}_R(\theta)'
    claim: The theta-derivative is a positive factor times g_R^N, linear in theta.
    status: verified
    method: symbolic
    note: Dividing the derivative by the printed prefactor leaves a polynomial of degree 1 in theta (and 2 in gamma). The printed bracket equals -(X1 + gamma W) < 0 (symbolic), so the prefactor is positive and g_R^N has the sign of the derivative.
  - id: 3
    locator: 'g^{N}_R(0) is a quadratic function of \gamma with \frac{\partial^2 g^{N}_R(0)}{\partial \gamma^2} <0'
    claim: g_R^N(0) is negative for gamma above its largest positive root gamma^R.
    status: verified
    method: symbolic
    note: My derivation - the gamma^2 coefficient of g_R^N(0) is -alpha_{B,2} m_B W < 0; the constant term c_A p_{B,1}^2 + c_B p_{A,1} p_{B,1} is positive, so gamma^R is the unique positive root and g_R^N(0) > 0 below it. g_R^N(0) contains alpha_{A,2}, prices and costs only.
  - id: 4
    locator: 'g^{N}_R(1) = p_{B,1} (c_{A} p_{B,1}+c_{B} p_{A,1})+\gamma p_{B,1} (...) > 0'
    claim: Value at theta = 1, positive for all gamma > 0.
    status: verified
    method: symbolic
    note: Equal to the printed expression, which equals p_{B,1}(c_A p_{B,1} + c_B p_{A,1}) + gamma p_{B,1} W > 0.
  - id: 5
    locator: 'Thus, if \gamma > \gamma^R, ... first negative then positive'
    claim: A linear function negative at 0 and positive at 1 has one root in (0,1); the sales fall then rise.
    status: verified
    method: re-derivation
    note: Direct; the root theta_0 = g(0)/(g(0) - g(1)) lies in (0, 1).
