confidence: high
restatement: >-
  Under A1 to A4, A6 to A11, I1 and I2, for every admissible market there is gamma^R > 0 (depending on prices, costs
  and alpha_{A,2}, not on theta, mu or sigma) such that for every gamma > gamma^R there is theta_0 in (0, 1) with
  E[R^N_1] strictly decreasing on [0, theta_0] and strictly increasing on [theta_0, 1].
