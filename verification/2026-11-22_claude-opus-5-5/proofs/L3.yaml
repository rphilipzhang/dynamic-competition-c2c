    status: verified
    method: re-derivation
    note: Substituting the continuation of step 1 (affine in R_{A,1} + R_{B,1}) and min(D, y) = y - (y - D)^+.
  - id: 3
    locator: 'The first-order derivative of the profit function in (A.12) w.r.t. $y_{A,1}$ is'
    claim: The derivative has the extra term - rho m_A alpha_{A,2} gamma d E[y_B - D_B]^+ / d y_A.
    status: verified
    method: re-derivation
    note: Direct differentiation; D_{B,1} depends on y_{A,1} through the spillover.
  - id: 4
    locator: '\mathbb{E}\left(y_{B,1} -D_{B,1} \right)^+ = \int_{0}^{y_{A,1}/\alpha_{A,1}}'
    claim: The two-integral expression of B's expected leftover.
    status: verified
    method: re-derivation
    note: For X <= y_A/alpha_A, D_B = alpha_B X; above, D_B = (alpha_B + theta alpha_A) X - theta y_A.
  - id: 5
    locator: 'Thus, $\mathbf{Prob} \left(D_{A,1} \leq y_{A,1} \right) = F\left(\frac{y_{A,1}+\theta y_{B,1}}{\alpha_{A,1}+\theta \alpha_{B,1}} \right)$ and'
    claim: In y_A/alpha_A >= y_B/alpha_B, Prob(D_A <= y_A) = F(u) and the leftover derivative is 0.
    status: verified
    method: re-derivation
    note: For X > a >= b the second integrand (y_B - alpha_B X) + theta (y_A - alpha_A X) is negative, and the first integral equals int_0^b (y_B - alpha_B z) f, independent of y_A. Derivation mine.
  - id: 6
    locator: '= \theta \left [F \left(\frac{y_{B,1}+\theta y_{A,1}}{\alpha_{B,1}+\theta \alpha_{A,1}} \right) - F\left(\frac{y_{A,1}}{\alpha_{A,1}} \right) \right]'
    claim: In y_A/alpha_A < y_B/alpha_B, Prob(D_A <= y_A) = F(a) and the leftover derivative is theta [F(w) - F(a)].
    status: verified
    method: re-derivation
    note: Leibniz rule; the boundary terms at z = a cancel because y_B + theta y_A - (alpha_B + theta alpha_A) a = y_B - alpha_B a, and the integrand vanishes at z = w. Derivation mine; also checked numerically in step 7.
