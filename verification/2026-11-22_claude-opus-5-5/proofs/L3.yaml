restatement: >-
  Fix any admissible point of Section 4 (A1, A11, I1, I2, theta in [0, 1]), any gamma > 0, rho = 1 in the
  displayed formula (the proof holds for rho in (0, 1], with rho and gamma entering only through rho gamma), and
  any F of the A3 class. Under cross-brand C2C (Z_{i,2} = alpha_{i,2} gamma R_1 with R_1 = R_{A,1} + R_{B,1}) and
  feedback play: (second) for every first-period sales state the second-period game has exactly one equilibrium,
  y^N_{i,2} = y^0_{i,2} + alpha_{i,2} gamma R_1; (first) given that continuation, the first-period game has exactly
  one equilibrium, y^N_{A,1} = (alpha_{A,1} + theta alpha_{B,1}) zeta^N_{A,1} - theta alpha_{B,1} zeta^N_{B,1},
  y^N_{B,1} = alpha_{B,1} zeta^N_{B,1}, with zeta^N_{A,1} = F^{-1}(1 - c_A/(p_{A,1} + alpha_{A,2} gamma m_A)) and
  zeta^N_{B,1} = F^{-1}(1 - [c_B - alpha_{B,2} gamma theta m_B c_A/(p_{A,1} + alpha_{A,2} gamma m_A)]/[p_{B,1} +
  alpha_{B,2} gamma (1 - theta) m_B]), m_i = p_{i,2} - c_i, and both arguments of F^{-1} lie in (0, 1); (unique) the
  two-period feedback equilibrium is unique; (profits) Pi^N_i, L^N_{i,1}, R^N_{i,1} are those displayed at the end
  of the proof.
differences_checked: []
hypotheses_used: [A2, A3, A4, A6, A7, A8, A9, A10, A11, I1, I2, I3]
unstated_hypotheses: []
relies_on:
  - "L1 proof: (A.1) and the region analysis of Prob(D_A <= y_A)"
  - "L2 proof: the shift argument and second-period best responses (A.5), (A.7), and the second-period profit pi^0_{i,2} + (p_{i,2} - c_i) Z_{i,2}"
steps:
  - id: 1
    locator: 'Let $\overline{\overline{y}}_{A,2} := y_{A,2} - \alpha_{A,2} \gamma R_{1}$'
    claim: Second period - shifted best responses of the form (A.5), (A.7), unique equilibrium y^0 + alpha_{i,2} gamma R_1, and profit pi^0_{i,2} + (p_{i,2} - c_i) alpha_{i,2} gamma E[R_1 | X_1].
    status: verified
    method: symbolic
    note: As steps 1 to 5 of L2 with Z_{i,2} = alpha_{i,2} gamma R_1; pathwise value identity C9 of shared_exact_identities.py (exact).
  - id: 2
    locator: '(A.12)'
