    status: verified
    method: re-derivation
    note: Each piece has a nonincreasing derivative (coefficients p_{A,1} + rho m_A alpha_{A,2} gamma (1 - theta) > 0 under I1); at the boundary both derivatives equal p - c + K - (p + K) F(y_B/alpha_B), so the derivative is continuous and nonincreasing throughout.
  - id: 9
