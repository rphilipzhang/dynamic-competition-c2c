    note: >-
      Derivation mine: the derivative at y_A = 0+ is at least p_{A,1} - c_A > 0 and tends to -c_A, so the best
      response is interior and unique (at a root at least one of F(a), F(w) lies in (0, 1)); the payoff derivative
