restatement: >-
  For every nonnegative i.i.d. seed-demand law with interval support and positive density in its interior, every admissible fixed pair of price paths and costs, every θ in [0,1], and each t=1,2, define z_i=F⁻¹(1−c_i/p_i,t). Without C2C the unique equilibrium orders in period t are y_B=b z_B and y_A=a z_A+θ b(z_A−z_B), where a=α_A,t and b=α_B,t. The result holds for every ρ in (0,1].
