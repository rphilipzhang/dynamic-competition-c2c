  assessment: >-
    The two direct tests compute exact rational normalized differences at 210 parameter points (120 regular, 90 edge), for both periods of the benchmark and both S/N first periods. The second-period S/N predicate uses the benchmark identity from L2/L3, so it checks the correct net quantity via that identity. The S/N first-period search spans 12 γ levels, 0.05 to 10⁶⁰, with θ endpoints included. It checks the weak signs and sharper implications: benchmark equality exactly at a binding lower A11 in the specified period, S equality when both bind, and strict first-period N inequality. The latter follows because α_A,2>α_B,2 if p_A,2<p_B,2, whereas equal prices and c_A<c_B give strict margin-to-cost ordering. Three port checks and the admissibility/quantile-region test support the comparisons.
