restatement: For each fixed admissible market there exists a θ-independent γB>0 such that for all γ≥γB, retailer
  B's S profit is constant in θ, its N profit is nondecreasing, and both exceed the benchmark strictly for every
  θ∈[0,1]. If its share differs across periods, S−N has the strict sign of αB1−αB2. With equal shares, choose
  a sufficient small positive ΔB. For each fixed qualifying market with 0<Δc≤ΔB, including equality at the upper
  endpoint, the growth bound may depend on its costs. At each γ≥γB there exists θB∈[0,1] depending on that γ and
  market, with S−N>0 on [0,θB) and S−N≤0 on [θB,1].
differences_checked: []
