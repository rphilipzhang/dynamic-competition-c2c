restatement: 'For each fixed admissible market there is γA>0, independent of θ, such that for every γ≥γA, ΠA,S
  is nondecreasing on θ∈[0,1], and ΠA,S and ΠA,N are both strictly greater than ΠA,0 throughout. If A’s shares
  differ across periods, the sign of ΠA,S−ΠA,N is the sign of αA1−αA2 throughout. With equal shares, choose a
  sufficient ΔA>0. For each fixed qualifying market with Δc≥ΔA, including equality, the growth bound may depend
  on its costs. For each γ at or above that bound there is θA∈[0,1] (depending on market and γ): S−N≥0 on [0,θA]
  and S−N<0 on (θA,1].'
