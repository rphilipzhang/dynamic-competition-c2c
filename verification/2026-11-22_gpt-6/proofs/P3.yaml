paper_statement: holds_as_printed
confidence: high
restatement: Fix any admissible market. For each sufficiently large γ, A's expected first-period sales are nondecreasing
  on θ∈[0,1] in both S and N. In fact for each γ>0 there is a cutoff t∈[0,1] with E RA,S≥E RA,N on [0,t] and E
  RA,S<E RA,N on (t,1]; for large γ it is interior. For every γ>0, B's expected first-period sales decrease weakly
  in θ in N, are constant in S and are strictly higher in S than in N for every θ.
