relies_on:
- L2–L3, equilibrium tails and the piecewise realized sales.
- P1 proof, (A.18)–(A.19) and strict positivity of H; P2(a,b) for B, without using P2(c).
steps:
- id: 1
  locator: By Lemma 2 and the uniform distribution
  claim: The S slope for A is a nonnegative difference of squared tail probabilities.
  status: verified
  method: re-derivation
  note: Write a,b,x,z,u,v,m,n as in P1 (period 1 and 2 shares, first prices and second margins). For upper support
    U and any ζ=U−2σq one has E[(X−ζ)⁺]=σq². With A the higher fractile, sales are a min(X,ζA)+θb[(X−ζB)⁺−(X−ζA)⁺]
    and B sells b min(X,ζB). Thus E RA=a(μ−σqA²)+θbσ(qB²−qA²). In S the two tails are constant, qB≥qA, with equality
    only if A11 binds in both periods.
- id: 2
  locator: At θ=0 in N and direct differentiation below
  claim: The N expected sales of A are increasing and convex throughout [0,1].
  status: verified
  method: re-derivation
  note: My derivation uses q=cA/(u+γxm), r=γzn, D=v+r(1−θ), H=cB−(v+r)q>0 and w=q+H/D from P1. Define f=w²−q².
    Then f>0, f′=2wHr/D²>0, and f″=2(Hr/D²)²+4wHr²/D³>0. The N slope at 0 is σbf(0), and its curvature is σb(2f′+θf″)>0.
    This verifies the printed assertion directly for every positive γ.
- id: 3
  locator: If θ=0, strictly positive sales difference
  claim: The S-minus-N difference is positive for any γ>0.
  status: verified
  method: re-derivation
  note: At zero substitution it is σa[q²−(cA/(u+γm))²]. The two positive tail denominators differ by γzm>0. Factoring
    the difference of squares gives the paper’s numerator and denominator.
- id: 4
  locator: If θ=1, fifth derivative of g_R
  claim: The S-minus-N difference becomes negative at full substitution.
  status: verified
  method: symbolic
  note: Let J=cB*x*m−cA*z*n>0 (P1). As γ grows, the S tails and q vanish, and w→J/(xmv) at θ=1. The difference
    tends to −σb[J/(xmv)]². Independently, clearing the positive denominator written in the proof and cancelling
    γσ gives a polynomial with fifth derivative −120 b m²n²J². This establishes the sign and the asserted growth
    implication under the original assumptions.
- id: 5
  locator: Closed interval [0,θ′]
  claim: The S-minus-N sales gap satisfies both inequalities and the equality at an interior cutoff.
  status: verified
  method: re-derivation
  note: Since S is affine and N convex, the nonnegative superlevel set of their continuous difference is a closed
    interval containing 0. It is the full interval if it contains 1. Otherwise its right endpoint lies below 1,
    continuity gives equality there, and the gap is strictly negative everywhere to its right. For large γ the
    endpoint comparison puts the root in (0,1).
- id: 6
  locator: Part (b), follows Proposition 2
  claim: B’s sales inherit the order dependence and strict S–N comparison.
  status: verified
  method: re-derivation
  note: P2(a,b) applies at the same prices, uniform law and γ>0. The function y↦E[min(bX,y)] has derivative Pr(bX>y)>0
    at the strictly interior inventories (its value at the limiting support endpoint follows continuously). P2(b)
    thus gives strict inequality at the same θ. Equivalently the N expectation is b(μ−σw²) with w′>0, and the
    S expectation uses the constant cB/(v+γn)<w.
findings: []
numerical:
  command: python numerics/run.py -k P3
  direct: 2/2 passed
  supporting: 5/5 passed
  assessment: Exact A sales increments and S−N signs use both θ endpoints over 210 markets, 12 γ rungs from .05
    through 10^60, and admit a flat S slope at double A11 equality. For A the top two rungs require an interior
    crossing; all rungs allow an all-positive difference. B’s calculation tests S constancy, strict N decrease
    and strict S>N at every node. The five supporting checks cover both analytical sales forms, their inventories
    and branch/admissibility. A finite sign grid does not prove the absence of additional crossings.
  own_checks:
  - 'scripts/shared_order_sales_shapes.py and logs/order_sales_shapes.log: curvature and the explicit fifth derivative.'
  - 'scripts/shared_exogenous_sales.py: integrated first-period sales representation.'
