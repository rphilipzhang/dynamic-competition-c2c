steps:
- id: 1
  locator: L3 closed form for total sales
  claim: Total sales are the mean seed demand less two weighted expected shortages.
  status: verified
  method: re-derivation
  note: Use a,b for A,B shares in period one, x,z for period two, u,v for first prices and m,n for second-period
    margins. Let q=cA/(u+γxm), r=γzn, D=v+r(1−θ), H=cB−(v+r)q and w=q+H/D. Integrating the lost sales of the uniform
    law gives E R=μ−σ[(a+θb)q²+(1−θ)bw²]. These are strictly interior uniform tails for any γ>0 including binding
    A11 and either θ endpoint.
- id: 2
  locator: Displayed derivative, g_R is affine
  claim: The derivative is a positive factor times a function affine in θ.
  status: verified
  method: symbolic
  note: 'My symbolic differentiation gives E R′=σbH L/D³, L=v(2qv+H)+r(1−θ)(2qv−H). Put K=u+γxm and J=cB*x*m−cA*z*n.
    We have H=(cB*u−cA*v+γJ)/K>0: the first numerator term is nonnegative by A11, J>0 by x≥z and cB*m≥cA*n, with
    simultaneous equality impossible. The printed bracket with its negative sign equals KH, and its displayed
    squared first factor is K². Thus its g_R=KL, indeed affine in θ.'
- id: 3
  locator: g_R(0) quadratic
  claim: The zero-substitution slope is negative for all sufficiently large γ.
  status: verified
  method: re-derivation
  note: Substitute r=γzn and Kq=cA. Then g_R(0)=v(2cA v+KH)+r(2cA v−KH), whose squared-growth coefficient is −znJ<0.
    Choose γR beyond its last nonnegative root if one exists.
- id: 4
  locator: g_R(1) positive
  claim: The full-substitution slope is positive at every γ>0.
  status: verified
  method: re-derivation
  note: At θ=1, g_R=v[cA v+cB u+γJ]. This is the printed expression after expanding the margins and using z=1−x.
    All factors are positive even at a binding price ratio.
- id: 5
  locator: First negative then positive
  claim: There is exactly one derivative sign change in (0,1).
  status: verified
  method: re-derivation
  note: An affine function with opposite strict endpoint signs has one zero in (0,1) and strict sign on either
    side. Its positive derivative multiplier cannot change that sign. Taking the endpoint γR once controls every
    θ simultaneously; small γ need not give the same shape.
