restatement: >-
  In each fixed admissible market and for every θ∈[0,1] and first-period price vector p in the
  closed price box, a common sufficiently large γ gives a unique pure N first-period inventory
  equilibrium. Write a=α_A, b=α_B in period 1, H=μ+σ, w=2σ, and
  q⁰=c_A/(p_A+γν_A), t⁰=(c_B−θγν_Bq⁰)/(p_B+γ(1−θ)ν_B). Its orders are
  (a+θb)(H−wq⁰)−θb(H−wt⁰) and b(H−wt⁰), each with a remainder bounded by C/γ²
  uniformly in θ and p. For each fixed positive total sale R in period 1, even off path,
  the unique equilibrium period-2 prices are p̂_i+O(1/(γR)) for sufficiently large γ,
  with p̂_i=1/(2β)+(2c_i+c_j)/3 and ν_i=α_i(p̂)(p̂_i−c_i). The cutoff and the
  O(1/γ) constant can depend on the fixed sales state. At every second-period price pair
  the unique stock for each firm equals its benchmark order plus its current share of γR.
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A6, A7, A8, A9, A10, A12, A13, A14, I1]
