relies_on:
  - L1 and L3 proofs, quantile best responses and translation of the terminal value; both price branches rederived in LA1 step 1.
  - LA1 joint proof, steps 2 and 7–19, including the normalized residual derivative bound and the fixed-θ profit expansion.
steps_in: LA1
steps:
  - id: 1
    locator: "A.2(a), ζ^N_A, ζ^N_B and the two order expressions"
    claim: The two leading stock expressions are exactly those obtained from the joint proof's two tail probabilities.
    status: verified
    method: re-derivation
    note: >-
      For X uniform on [L,H], F⁻¹(1−q⁰)=H−wq⁰ and F⁻¹(1−t⁰)=H−wt⁰. LA1 steps 14–18
      show 0<q<t<1 and 0<q⁰<t⁰<1 for large γ, including θ=1. The exact coordinate inversion
      y_B=b s, y_A=(a+θb)z−θb s returns the two expressions with O_C²(p)(γ⁻²) error.
      At θ=0, t⁰=c_B/(p_B+γν_B); at θ=1, its denominator is p_B, so t may be order one
      even though q is order 1/γ. For intermediate paths with γ(1−θ) bounded, LA1 step 16
      retains the uniform remainder. Equal prices/shares and the A11 equality line have no
      special first-period singularity; A11 is not imposed in the endogenous-price model.
  - id: 2
    locator: "A.2(b), given R^N₁>0 ... conditional on second-period prices"
    claim: At a fixed positive total sale the N prices have the stated rate and the stock identity is exact at all prices.
    status: verified
    method: re-derivation
    note: >-
      With R fixed the λ=γR price-equilibrium expansion of LA1 steps 7–9 gives
      p_i=p̂_i+O(γ⁻¹), independently of how that total was split across retailers. On R≥r₀>0
      the expansion is uniform. The translation Z_i=γα_i(p_2)R in LA1 step 1 is exact
      even for small γ or zero sales. P7 uses this conditional stock identity, P8 uses the
      uniform price derivatives of the period-1 stocks in part (a), and P9 uses the more
      specific fixed-θ<1 reduced-profit expansion in the joint proof (LA1 step 19).
findings: []
numerical:
  command: python numerics/run.py -k LA2 --report verification/2026-11-22_gpt-6/logs/report_LA2.md
  direct: "5/5 passed"
  supporting: "3/3 passed"
  assessment: >-
    Read the marked checks in test_section_5_first_period.py, test_section_5_second_period.py and
    the transcription checks alongside the smooth-continuation, marginal-profit and claimed-order
    functions in c2c/section5.py. One check fits stock remainder rates and searches unilateral
    deviations in 16 markets at fixed price pairs, θ=0, θ=1 or fixed interior θ, γ from 10 to
    10⁴. The last usable orders rounded to 2 at θ=1 and 3 at θ<1, both compatible with O(γ⁻²).
    A second holds each of eight markets/prices fixed and varies θ=1−ℓ/γ for eight ℓ values
    from 0 to 30 at γ=300,1000,3000; the successive maxima of the scaled errors had ratios
    rounding to 1.0. A third used 18 best-response iterations and four fixed-point sign scans
    at γ=1000, with a positive rival floor, and found a single crossing in each scan. A fourth
    checked price order/ν at 2000 markets and compared limit prices with computed equilibria
    at 12 fixed positive total sales on a γ ladder from 10 to 10⁶; all 12 met the price and
    deviation criteria and the last two rates rounded to 1. Its empirical linear-rate,
    monotone-decay and tolerance criteria are more specific than the stated upper bound.
    The fifth tested both stock/conditional-payoff identities at 100 prices/states, 25 on
    the reverse-fractile branch. Three supporting checks cover integration/continuation
    machinery, benchmark helpers and transcription. The checks give pointwise and boundary
    evidence; the uniform derivative and positive-state arguments are in the joint record.
