restatement: For each admissible exogenous-price market and each growth rate γ>0, each of A's benchmark, S and
  N equilibrium orders in period 1 is nondecreasing in θ on [0,1]. For every such market there is a sufficiently
  large growth level independent of θ. For each γ above it there is a cutoff in [0,1] with yS≥yN below and including
  the cutoff and yS≤yN above and including it.
