- item: theory.md Implicit conditions I1–I3
  compared_with: Interior fractiles and shares in Sections 3–5, Appendix A.1 and B
  method: reading
  result: consistent
  note: 'I1 gives positive costs and margins. I2 keeps both exogenous shares interior, implied in Section 5 by A12.
    I3 follows from A11 and I1–I2: writing qA=cA/(pA1+ownA) for the high retailer, B''s tail is (cB-crossB*theta*qA)/(pB1+ownB-crossB*theta);
    cost-ratio ordering gives qB>=qA>0, and pB1>cB gives qB<1. These are recorded context conditions; see the respective
    result for additional dependencies.'
  findings: []
