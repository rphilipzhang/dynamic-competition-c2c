- item: numerics c2c/primitives.py
  compared_with: Section 3, demand, sales, C2C and timing equations; section4.Game and Section 5 payoff assembly
  method: reading
  result: consistent
  note: The split is 1/2+beta(pj-pi), effective demand is own pre-stockout demand plus theta times the other shortage;
    sales are its minimum with inventory. S uses own prior sales, N splits total prior sales, and G is their convex
    combination. Uniform integration splits at all possible kinks; quadrature handles the other bounded laws. The
    primitive module imports no result. Payoff callers charge costs on orders and credit revenues on sales, using
    the verified affine continuation in the undiscounted two-period sum.
  findings: []
- item: numerics c2c/section4.py claimed_*
  compared_with: L1, L2, L3, LB1 and Appendix A.1/B
  method: reading
  result: consistent
  note: Matched the high/low critical-ratio branches, price-ratio boundary, own/cross effects and both order thresholds.
    The benchmark swaps roles under the opposite ratio. The general formula specializes to S, N and mixtures; the
    first-period denominator and cross adjustment use different own/cross coefficients where appropriate.
  findings: []
- item: numerics c2c/section5.py claimed_* and signs
  compared_with: Appendix A.2; LA1, LA2, P8 and P9
  method: reading
  result: consistent
  note: Matched both limit prices, margin/share nu, price-bound solutions for S, leading orders and O(gamma^-2)
    residual for N, the four types of price-derivative signs, A.22, A.23 and both strict price paths. The code distinguishes
    bounded gamma(1-theta) from a fixed theta<1; the first-period limiting price is labeled proof evidence.
  findings: []
