  checks: {direct: "9/9 passed", supporting: "8/8 passed"}
  relies_on: >-
    c2c/pricing.py (pricing_equilibrium: certification of one constant second-period price pair over the
    sales triangle, first-period pure equilibria), c2c/closed_form.py (period2_profit, first_period_s/n,
    spfta_t1, spftb_t1, npfta_t1, npftb_t1), c2c/figures.py (FIG1_PARAMS, FIG1_PANELS, FIG1_THETA,
    figure1_point, figure1_crossings), and for the cross-checks c2c/section4.py (Game,
    claimed_first_period) and c2c/primitives.py; numerics/figures/published_data.csv and its calibration.
  assessment: >-
    The direct checks compare the recomputed profits of both scenarios with the four published panels
    (largest difference to the four-decimal values 2.2e-6, 1.6e-5, 1.8e-6, 1.0e-5 for panels a-d, each
    within the panel's extraction bound; to the unrounded values at most 5.6e-5, consistent with panels
    drawn from four-decimal data), require one equilibrium and no solver warning at all 44 points, and
    rebuild the game from the primitives: all 352 first-period payoff cells (44 with retailer B holding
    the higher fractile) agree within 1e-9, 96 first-period inventory games at theta = 0.01, 0.5, 0.99
    are equilibria, the solver's second-period price pair is the only equilibrium pair at 10 sales states
    including the three corners of the sales triangle (with payoffs affine in the sales state this covers
    every state; the affine form is the supporting link (c) check), and 48 second-period inventory games
    are equilibria. These test what they name. Own checks: on 201 values of theta in [0, 1], including the
    end points the figure omits, the solver certifies a unique equilibrium without warning in every panel,
    the equilibrium price paths do not change with theta (S: (4,4,4,4) in panels a, c and (2,2,4,4) in
    b, d; N: (4,4,4,4) everywhere), and the curves keep the published shapes. An independent parse of the
    EPS files reproduces published_data.csv within 5.9e-7. The panels match the captions' parameters as
    implemented in figures.py; the line-by-line audit of pricing.py, closed_form.py and figures.py against
    the MATLAB code is another agent's item and this entry relies on it.
