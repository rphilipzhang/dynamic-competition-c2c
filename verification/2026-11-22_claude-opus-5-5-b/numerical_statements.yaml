- id: N1
  holds: "yes"
  checks: {direct: "1/1 passed", supporting: "1/1 passed"}
  relies_on: c2c/figures.py figure1_data, hence c2c/pricing.py and c2c/closed_form.py (as F1).
  assessment: >-
    The direct check computes alpha_{A,t} = 1/2 + beta (p_{B,t} - p_{A,t}) at the equilibrium prices of
    all 44 Figure 1 points in both scenarios, requires exact equality across periods, and finds the price
    path changing at 22 (point, scenario) pairs (Scenario S in panels b and d, (2,2) then (4,4)), so both
    halves of the sentence are tested. "Our numerical experiments" may be wider than the plotted points.
    Own sweep of the stated setting (prices {2,4}, c_B = 1, beta = 0.1, U[5,15]) over gamma = 0.1..3.0,
    c_A in {0.1, 0.3, 0.5, 0.7, 0.95} and 21 values of theta: 6300 price games, no refusal or warning,
    6678 first-period equilibria (378 games in Scenario S have two, (2,2) and (4,4), both followed by
    (4,4)), and the split ratio is the same in both periods at every one of them; for gamma = 5 to 1000
    the paths are again (2,2,4,4) in S and (4,4,4,4) in N. In every equilibrium found both retailers
    charge the same price within a period, so alpha = 1/2 in both periods.
  own_checks: [verification/2026-11-22_claude-opus-5-5-b/scripts/F1_fine_theta_grid.py, verification/2026-11-22_claude-opus-5-5-b/scripts/N1_gamma_cost_sweep.py]
  findings: []

