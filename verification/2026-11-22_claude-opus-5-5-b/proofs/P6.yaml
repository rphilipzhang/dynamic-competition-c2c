  direct: "4/4 passed"
  supporting: "6/6 passed"
  assessment: >-
    P6.a: Pi^S_B exactly constant and Pi^N_B strictly increasing at the top rungs (strict increase is true for every
    gamma, step 2). P6.b: strict gains at every node at the top rungs. P6.c1: 66 points with unequal shares, strict
    sign at every theta node at the top rungs. P6.c2: points are selected by P6_SIGN_AT_THETA_ZERO > 0, the bracket at
    the actual share alpha_{A,2}. That set contains every market covered by the proof's sufficient condition (bracket
    at abar > 0) and more (step 12), so the check tests the conclusion on a superset of the markets the cutoff
    guarantees; the docstring's phrase "which is the cost condition" is loose on this point but the test is correct.
    18 sample points plus 90 further points; at the top rungs, positive at 0, negative at 1, pattern "+-" with zeros
    skipped (the weak "<=" on [theta^B, 1] needs nothing more). The 126 sample points with a negative bracket all
    show "-", consistent with step 9. Each check tests the part it names.
  own_checks:
    - verification/2026-11-22_claude-opus-5-5-b/scripts/shared_profit_polys.py
    - verification/2026-11-22_claude-opus-5-5-b/scripts/P6_symbolic_steps.py
