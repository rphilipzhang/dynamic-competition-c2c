  model: claude-opus-5-5
  harness: Claude Code
  date: "2026-11-22"
  prior_exposure: >-
    As in verification/2026-11-22_claude-opus-5-5-b/proofs/P1.yaml: the user's auto-memory index for this project and the parent project's AGENTS.md were
