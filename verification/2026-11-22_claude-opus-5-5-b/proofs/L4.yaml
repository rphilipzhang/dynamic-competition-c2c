    locator: 'by part (a) and Lemma 2, (y^S_{A,2} - Z^S_{A,2})/alpha_{A,2} = y^0_{A,2}/alpha_{A,2} >= y^0_{B,2}/alpha_{B,2} = (y^S_{B,2} - Z^S_{B,2})/alpha_{B,2}'
    claim: Part (b), Scenario S, period 2.
    status: verified
    method: symbolic
    note: y^S_{i,2} = y^0_{i,2} + gamma R_{i,1} = y^0_{i,2} + Z^S_{i,2} (Lemma 2), then part (a) with t = 2; holds for every sales state.
