    locator: 'Furthermore, by analogous arguments, we have (y^N_{A,2} - Z^N_{A,2})/alpha_{A,2} >= (y^N_{B,2} - Z^N_{B,2})/alpha_{B,2}'
    claim: Part (b), Scenario N, period 2.
    status: verified
    method: symbolic
    note: Derivation mine. Lemma 3 gives y^N_{i,2} = y^0_{i,2} + alpha_{i,2} gamma R_1 = y^0_{i,2} + Z^N_{i,2}, so the net orders per unit of share are y^0_{i,2}/alpha_{i,2} and part (a) with t = 2 applies (SymPy check in L4_identities.py).
