restatement: >-
  Under the assumptions of Section 4 (A1, A11 in both periods, I1, I2, theta in [0, 1],
  gamma > 0, rho = 1, uniform seed demand A10; the argument holds for any F of A3), with the
  equilibrium orders of Lemmas 1 to 3: (a) for t = 1 and t = 2, y^0_{A,t}/alpha_{A,t} >=
  y^0_{B,t}/alpha_{B,t}; (b) for k = S and k = N, y^k_{A,1}/alpha_{A,1} >= y^k_{B,1}/alpha_{B,1}, and,
  for every first-period sales state, (y^k_{A,2} - Z^k_{A,2})/alpha_{A,2} >= (y^k_{B,2} -
  Z^k_{B,2})/alpha_{B,2}, with Z^S_{i,2} = gamma R_{i,1} and Z^N_{i,2} = alpha_{i,2} gamma R_1. All
  inequalities are weak. (Equality holds in (a) exactly where A11 binds in period t, in (b) for S
  in period 1 exactly where A11 binds in both periods; for N in period 1 the inequality is strict.)
