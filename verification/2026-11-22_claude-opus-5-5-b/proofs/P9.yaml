numerical:
  command: python numerics/run.py -k P9 --report verification/2026-11-22_claude-opus-5-5-b/logs/report_P9.md
  direct: "2/2 passed"
  supporting: "3/3 passed"
  assessment: >-
    P9.a: at 20 markets the reduced payoffs are built from the model with the Lemma A.1(a) orders (confirmed at every grid
    pair by vanishing marginal profits and a pinned continuation); p_lo is the best reply to every rival grid price,
    iterations end at (p_lo, p_lo), and the second-period grid game at three induced states has (p_hi, p_hi) as its only
    pure equilibrium; it holds at all markets from gamma = 1e3, and the advantage of p_lo grows tenfold per decade, as
    step 2 predicts. P9.b: at 5 markets with theta scaled to 0.9 theta (fixed theta < 1), the first-period price equilibrium
    of the reduced game is located by best-response iteration from two corners and confirmed by searches; the strict chain
    p_lo < min p_{i,2}, max p_{i,2} < p_{i,1} < p_hi holds over 201 induced states from gamma = 100; the gap settles to the
    limit sigma(2c_i + c_j)/(3 mu) within 0.5% at gamma = 1e4. The predicates are the strict inequalities of the statement.
  own_checks:
    - "verification/2026-11-22_claude-opus-5-5-b/scripts/P9_price_path_steps.py: closed-form Scenario S sales and the O(1) own-price derivative bound; limit game, Jacobian, Lipschitz condition and the price gap (SymPy)"
    - "verification/2026-11-22_claude-opus-5-5-b/scripts/P9_profit_expansion_fixed_theta.py: the expansion of Pi_i^N and its own-price derivative from the model, at theta = 0.5, 1 - 1/gamma and 1"
not_checked:
  - The existence part of the statement for off-path states relies on the repair recorded in LA1/F1 rather than on an argument in the paper.
