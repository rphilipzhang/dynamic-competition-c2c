restatement: >-
  Assume A1-A10, A12, A13 and I1. For every gamma > 0, theta in [0, 1], every first-period sales state (R_A, R_B) with
  R_i >= 0, each scenario k in {S, N} and each retailer i, let y^k_{i,2}(p_A, p_B) be the equilibrium order of the
  second-period inventory subgame at second-period prices (p_A, p_B) in [p_lo, p_hi]^2. (a) For every fixed rival price
  p_j in [p_lo, p_hi], the map p_i -> y^k_{i,2} on [p_lo, p_hi] is nonincreasing, or has one or two local maxima in the
  open interval (p_lo, p_hi). (b) For every fixed p_i in [p_lo, p_hi], the map p_j -> y^k_{i,2} is nondecreasing, or
  first decreases and then increases.
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A12, A13, I1]
