    status: verified
    method: numerical
    note: >-
      Derivation: differentiating J(p) dw = -E(w(p), p) in p, with dw = O(gamma^-2), dE = O(gamma^-2), dJ/dp bounded and
      dw^0/dp bounded uniformly in theta, gives the first and, once more, the second derivatives. Script
      LA2_remainder_bounds.py: gamma^2 times the inventory remainder and its first price differences stay bounded on
      gamma = 1e2, 1e3, 1e4 at theta = 0, 0.5, 1 - 10/gamma, 1 - 1/gamma, 1 (largest 0.0081; growth of the max over theta
