findings:
  - id: F1
    severity: minor
    scope: proof
    locator: 'uniformly over sales states and first-period equilibrium selections; When \gamma R_1 is bounded, ... |V_i(R_{1}) - \gamma\nu_i R_{1}| \leq C'
    description: >-
      The joint proof bounds the continuation value V_i at every first-period sales state, including states where gamma R_i
      (Scenario S) or gamma R_1 (Scenario N) is small, but does not show that the second-period price game has an
      equilibrium there; at those states the payoff need not be quasi-concave and a pure equilibrium is not guaranteed.
      The selection that the bound must be uniform over is that of second-period equilibria, while the text says
      first-period equilibrium selections. The first-period subgames, and the equilibrium profile of Proposition 9, are
      defined only once such continuation equilibria exist.
    suggested_fix: >-
      Add one sentence: the second-period price game has continuous payoffs on the compact box, so it has a (possibly mixed)
      equilibrium at every sales state (Glicksberg); the bounds hold for every such equilibrium and every measurable
      selection. Replace 'first-period equilibrium selections' by 'second-period equilibrium selections'.
    evidence: >-
      Steps 3 and 17. pi^0_i is continuous on the box, including at the fractile switch where both forms of Lemma 1 give
      y_i = alpha_i zeta (script section E shows it is even C^1 there). For a mixed equilibrium, deviating to p_hi gives
      V_i >= gamma (p_hi - c_i) R_i in Scenario S and V_i >= 0 in Scenario N, and V_i <= sup pi^0_i + gamma (p_hi - c_i) R_i,
      resp. sup pi^0_i + gamma R_1 max alpha(p - c); the domination arguments of steps 4 and 20 use nothing else. On the
      states that the equilibria and their unilateral deviations reach, the continuation equilibrium is unique (steps 6, 13).
  - id: F2
    severity: editorial
    scope: proof
    locator: '|\partial^2 V_i(R_{1})| \leq C_{r_0} /\gamma > 0'
    description: The trailing '> 0' attaches a positivity claim to a bound on the absolute value of the second derivative.
    suggested_fix: Write |d^2 V_i(R_1)/dR_1^2| <= C_{r_0}/gamma for R_1 >= r_0 > 0.
    evidence: Step 18; the intended statement is the bound, and it is what step 24 uses.
  - id: F3
    severity: editorial
    scope: theory.md
    locator: theory.md LA1, Hypotheses line
    description: >-
      The Hypotheses line of LA1 lists A13, which the Scenario S part of the joint proof does not use (the domination
      constant uses A12, the ordering threshold uses A1 and I1; A13 enters only the Scenario N limit prices).
    suggested_fix: Drop A13 from LA1's Hypotheses line, or note that it is listed because the proof is joint with LA2.
    evidence: Steps 2-8 use no price-bound condition beyond A12; A13 is used in step 14 only.
numerical:
  command: python numerics/run.py -k LA1 --report verification/2026-11-22_claude-opus-5-5-b/logs/report_LA1.md
  direct: "4/4 passed"
  supporting: "3/3 passed"
  assessment: >-
    The four direct checks test what they name with the statement's predicates. LA1.a: at 30 markets the claimed pair is
    confirmed by a deviation search over each whole order interval, by vanishing model marginal profits (the form is
    exact), and with the continuation pinned at p_hi; it holds at all markets from gamma = 100 and fails at gamma = 1 at
    some, and a best-response iteration from 60 starts returns to it. LA1.b: (p_hi, p_hi) is the only pure equilibrium of
    a 61 x 61 grid game and survives continuous searches and iterations from five starts, from gamma = 10 at all 30
    markets; the second-period inventory claim is checked at 100 price pairs, 25 of them with retailer B's fractile higher.
    Both direct checks of (a) restrict starting and rival orders to the region where the continuation is pinned, which
    the proof's domination argument covers. The checks probe a ladder of gamma and cannot establish a threshold.
  own_checks:
    - "verification/2026-11-22_claude-opus-5-5-b/scripts/LA1_joint_proof_steps.py: notation facts, delta, the S ordering threshold, the R_1 formula, C^1 of pi^0 at the switch, (A.21) in SymPy, the FOC display against the model, E R_1 formula"
    - "verification/2026-11-22_claude-opus-5-5-b/scripts/LA2_remainder_bounds.py: O(gamma^-2) remainders with first and second price derivatives, uniform in theta (step 35)"
    - "verification/2026-11-22_claude-opus-5-5-b/scripts/P9_profit_expansion_fixed_theta.py: the final expansion of Pi_i^N and its theta dependence (step 36)"
