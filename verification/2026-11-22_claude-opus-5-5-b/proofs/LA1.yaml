      because (1 - theta)/(1 + gamma(1 - theta)) <= 1/gamma, dQ/dp = -beta(1 - theta)(z - s) = O(1/gamma); ds/dv is O(1)
      when gamma(1 - theta) is bounded, but it multiplies (1 - theta)(t - q) = O(1/gamma), whose own (u, v) derivatives are
      O(1/gamma). With e_B' in O_{C^3}(1/gamma) (from step 16) each term of E_A = (u/gamma) e_A'(Q) and of r is a product
      of two O(1/gamma) factors with bounded derivatives up to order two. All candidates satisfy u = u^0 + O(gamma^-2)
      directly from the first line and then v = v^0 + O(gamma^-2); the O(gamma^-2) box around (u^0, v^0) is convex and
      keeps t - q > 0, because t^0 - q^0 >= c/(p_hi + gamma nu_B).
