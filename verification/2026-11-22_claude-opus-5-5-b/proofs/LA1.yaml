    claim: Expansion of the reduced first-period payoff of Scenario N, used by Proposition 9.
    status: verified
    method: numerical
    note: >-
      My derivation. E R_1 = mu - (1 - theta) alpha_B sigma t^2 - (alpha_A + theta alpha_B) sigma q^2 (script section H,
