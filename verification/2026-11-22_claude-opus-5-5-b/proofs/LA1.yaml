restatement: >-
  Assume A1-A5, A7-A10, A12 and I1 (Scenario S, uniform seed demand on [mu - sigma, mu + sigma], rho = 1,
  prices in [p_lo, p_hi] with p_lo > c_B and beta < 1/(2(p_hi - p_lo))). (a) There is gamma_0 < oo, depending
  on the market but not on the first-period prices p_1 in P = [p_lo, p_hi]^2 or on theta in [0, 1], such that for
  every gamma > gamma_0, every p_1 in P and every theta in [0, 1], and for every selection of second-period
  equilibria at the sales states, the first-period inventory subgame has exactly one pure Nash equilibrium,
  y_A = (alpha_A + theta alpha_B) zeta_A - theta alpha_B zeta_B and y_B = alpha_B zeta_B with
  zeta_i = F^{-1}(1 - c_i/(p_{i,1} + gamma (p_hi - c_i))). (b) For every sales state with R_A > 0 and R_B > 0
  there is gamma_1(R) such that for gamma > gamma_1(R) the second-period price game has exactly one equilibrium,
  (p_hi, p_hi); and for every gamma > 0, every second-period price pair in P and every sales state, the
  second-period inventory subgame has exactly one equilibrium, y_i = y^0_{i,2} + gamma R_i.
