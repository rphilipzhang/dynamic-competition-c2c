confidence: high
restatement: >-
  Assume A1-A11, I1, I2. For every admissible market there is gamma^A > 0 such that for every gamma >= gamma^A and
  every theta in [0,1]: (a) Pi^S_A is nondecreasing in theta (true for every gamma > 0); (b) Pi^S_A > Pi^0_A and
  Pi^N_A > Pi^0_A, with gamma^A independent of theta; (c1) if alpha_{A,1} < alpha_{A,2} then Pi^S_A < Pi^N_A, and if
  alpha_{A,1} > alpha_{A,2} then Pi^S_A > Pi^N_A, with gamma^A independent of theta. (c2), fixed-market reading of
  AGENTS.md: suppose alpha_{A,1} = alpha_{A,2}. There is a cost cutoff Delta^A > 0 (a sufficient one; it may depend
  on c_A, the four prices and the shares, through c-bar_B) such that for each admissible market with
  Delta c >= Delta^A the bound gamma^A may depend on the costs and applies to every theta in [0,1], and for each
  gamma >= gamma^A there is theta^A in [0,1], depending on gamma and the market, with Pi^S_A >= Pi^N_A on
  [0, theta^A] and Pi^S_A < Pi^N_A on (theta^A, 1]. Threshold dependence found in the proof: gamma^A_1 arbitrary;
  gamma^A_2 and gamma^A_3 depend on the market primitives but not on theta; c-bar_B and Delta^A on c_A, prices
  and shares; gamma^A_4 on the market including c_B, not on theta; theta^A on gamma and the market.
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, I1, I2, I3]
