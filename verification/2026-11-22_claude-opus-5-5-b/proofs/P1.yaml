restatement: >-
  Assume A1-A11 (uniform seed demand on [mu-sigma, mu+sigma], rho = 1, p_{B,t} >= p_{A,t} >= (c_A/c_B) p_{B,t}),
  I1 and I2. (i) For every admissible market and every gamma > 0, each of the benchmark order y^0_{A,t}
  (written y^0_A in the statement; the same holds for t = 1 and t = 2), y^S_{A,1} and y^N_{A,1} is a
  nondecreasing function of theta on [0,1]. (ii) For every admissible market there is a gamma-bar, which may
  depend on all market primitives, such that for every gamma >= gamma-bar there exists theta^SN in [0,1],
  which may depend on gamma and the market, with y^S_{A,1} >= y^N_{A,1} for all theta in [0, theta^SN] and
  y^S_{A,1} <= y^N_{A,1} for all theta in [theta^SN, 1].
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, I1, I2, I3]
