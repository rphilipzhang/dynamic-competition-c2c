    locator: 'Statement: "namely $y^{0}_{A}$"; proof: "$\theta^{SN}$"'
    description: >-
      Notation: the statement writes the benchmark order as y^0_A without the period index used for the other two
      quantities (y^S_{A,1}, y^N_{A,1}), and it names the threshold \underline{\theta}^{SN} while the proof
