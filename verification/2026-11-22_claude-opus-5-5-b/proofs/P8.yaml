restatement: >-
  Assume A1-A10, A12, A13, A14 and I1, and write y^k_{i,1}(p_1) for the unique first-period equilibrium orders of
  Lemmas A.1(a), A.2(a). (a) There is gamma^a such that for all gamma > gamma^a, theta in [0, 1] and p_1 in P:
  dy^S_{i,1}/dp_{i,1} < 0 and dy^S_{i,1}/dp_{j,1} > 0, i = A, B. (b1) There is gamma^b such that for all gamma > gamma^b,
  theta in [0, 1] and p_1 in P: dy^N_{A,1}/dp_{A,1} < 0 and dy^N_{B,1}/dp_{A,1} > 0. (b2) If (A.22) holds, there are an
  open set U of first-period price pairs (a neighbourhood of any chosen pair of (A.23)), l^D > 0 and gamma^D < oo such that
  for all gamma > gamma^D, all theta with 0 <= gamma (1 - theta) <= l^D and all p_1 in U: dy^N_{A,1}/dp_{B,1} < 0 and
  dy^N_{B,1}/dp_{B,1} > 0; and for every fixed theta < 1 there is gamma(theta) such that for gamma > gamma(theta) and all
  p_1 in P: dy^N_{A,1}/dp_{B,1} > 0 and dy^N_{B,1}/dp_{B,1} < 0. Strict signs give the printed weak monotonicity.
differences_checked: []
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A12, A13, A14, I1]
