steps:
  - id: 1
    locator: 'By Lemma 3, we have the closed form of $\mathbb{E} [R^{N}_{1}]$.'
    claim: Closed form of total expected first-period sales in Scenario N.
    status: verified
    method: symbolic
    note: >-
      E[R^N_1] = mu - sigma(alpha_{A,1} + theta alpha_{B,1})(c_A/P^N_A)^2 - sigma(1-theta) alpha_{B,1} r^2 (sum of
      the two sales identities of the P3 record); equal to the full closed form exactly at 8/8 random points.
  - id: 2
    locator: '\frac{\partial }{\partial \theta}\mathbb{E} [R^{N}_{1}] = \frac{- \alpha_{B,1} [c_{A} (p_{B,1}-(\alpha_{A,2}-1) \gamma  p_{B,2})-c_{B} (\ldots)] \sigma}{(\ldots)^2 (\ldots)^3} g^{N}_R(\theta)'
    claim: Factorization of the theta-derivative with a positive prefactor and g^N_R linear in theta.
    status: verified
    method: symbolic
    note: >-
      My derivation, checked in SymPy: with Delta = Q1 + gamma Q2 = c_B P^N_A - c_A(p_{B,1} + J) > 0 and
      u = J(1-theta), dE[R^N_1]/dtheta = alpha_{B,1} sigma Delta g(theta)/[(P^N_A)^2 den^3] with
      g(theta) = 2 c_A p_{B,1}(p_{B,1} + u) + Delta(p_{B,1} - u), linear in theta. The printed bracket equals
      -Delta, so the printed prefactor -alpha_{B,1}[...]sigma = alpha_{B,1} sigma Delta > 0 (the prefactor sign
      is not argued in the proof; derived here). The printed denominator factor squared equals (P^N_A)^2, and
      den > 0. Hence g has the sign of the derivative.
  - id: 3
    locator: '$g^{N}_R(0)$ is a quadratic function of $\gamma$ with $\frac{\partial^2 g^{N}_R(0)}{\partial \gamma^2} <0$. Thus, there exists a $\gamma^R>0$ such that $g^{N}_R(0) <0$ if $\gamma > \gamma^R$.'
    claim: g(0) < 0 for large gamma.
    status: verified
    method: symbolic
    note: >-
      g(0) has degree 2 in gamma with leading coefficient -alpha_{B,2}(p_{B,2}-c_B) Q2 < 0 (SymPy). gamma^R is its
      largest positive root and does not depend on theta; over 200 exact admissible points it ranged from 2.02 to
      1.16e3, and at gamma = 1/20 E[R^N_1] was increasing at theta = 0 at 200/200 points, so a threshold is needed.
  - id: 4
    locator: '$g^{N}_R(1) = p_{B,1} (c_{A} p_{B,1}+c_{B} p_{A,1})+\gamma p_{B,1} (\ldots) > 0$ for all $\gamma > 0$.'
    claim: g(1) > 0 for every gamma > 0.
    status: verified
    method: symbolic
    note: My g(1) equals the printed one and equals p_{B,1}(c_A p_{B,1} + c_B p_{A,1} + gamma Q2) > 0 (SymPy).
  - id: 5
    locator: 'Thus, if $\gamma > \gamma^R$, ... $\mathbb{E} [R^{N}_{1}]$ first decreases then increases in $\theta$'
    claim: A linear g with g(0) < 0 < g(1) gives a single interior minimum.
    status: verified
    method: re-derivation
    note: >-
      The root theta_0 of g lies in (0,1) and the derivative is negative before it and positive after. Solving
      g = 0 gives u = (2 c_A p_{B,1}^2 + Delta p_{B,1})/(Delta - 2 c_A p_{B,1}) -> p_{B,1}, so 1 - theta_0 ~ p_{B,1}/J = O(1/gamma) (my derivation), consistent with the check's grid layer 1 - t/gamma. Exact probe at 200
      points with gamma = 2 gamma^R: direction pattern "-+" on a grid of 101 to 105 theta nodes at every point.
