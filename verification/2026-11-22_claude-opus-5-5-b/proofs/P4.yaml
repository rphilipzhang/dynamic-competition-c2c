restatement: >-
  Assume A1-A4, A6-A11, I1, I2 (Scenario N only). For every admissible market there is gamma^R > 0, which may
  depend on the market primitives but not on theta, such that for every gamma > gamma^R there is theta_0 in
  (0,1) with E[R^N_1] nonincreasing on [0, theta_0] and nondecreasing on [theta_0, 1] (in fact strictly).
