restatement: >-
  Assume A1-A4, A6-A10, A12, A13 and I1 (Scenario N). (a) There is gamma_0 < oo, depending on the market but not on
  p_1 in P or theta in [0, 1], such that for every gamma > gamma_0 the first-period inventory subgame has exactly one
  pure equilibrium, and y_A - [(alpha_A + theta alpha_B) zeta^N_A - theta alpha_B zeta^N_B] and y_B - alpha_B zeta^N_B are
  bounded by C/gamma^2 with C independent of p_1 and theta, where zeta^N_A = F^{-1}(1 - c_A/(p_{A,1} + gamma nu_A)) and
  zeta^N_B = F^{-1}(1 - [c_B - theta gamma nu_B c_A/(p_{A,1} + gamma nu_A)]/[p_{B,1} + (1 - theta) gamma nu_B]); the joint
  proof also bounds the first two price derivatives of these remainders by C/gamma^2. (b) For every R_1 > 0 there is
  gamma_1(R_1) such that for gamma > gamma_1 the second-period price game has exactly one equilibrium and
  |p^N_{i,2}(R_1) - p^_{i,2}| <= C/(gamma R_1); for every gamma, every second-period price pair and every sales state the
  second-period inventory subgame has exactly one equilibrium, y_i = y^0_{i,2} + gamma alpha_{i,2} R_1.
differences_checked: []
