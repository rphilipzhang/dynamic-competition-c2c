  assessment: >-
    The direct checks test the parts they name. LA2.a: the distance between the closed form and the model's equilibrium
    (solved from the model's FOCs, confirmed by deviation searches) shrinks with observed order at least 1.99 from
    gamma = 100, at theta = 0, 1 and 0.9 theta; a separate check holds gamma (1 - theta) fixed at eight levels up to 30 and
    finds gamma^2 times the error flat in gamma (growth 0.97-1.01 per step), which tests the uniformity in theta that P8
    needs; uniqueness is probed by iteration and by a fixed-point residual scan with one sign change, both restricted to
    rival orders above a small floor d. LA2.b: the price equilibrium is unique on the ladder and approaches p^_{i,2} at
    observed rate 1.00; the notation facts nu_A > nu_B > 0, c_A/nu_A < c_B/nu_B and interior limit prices are checked at
    2,000 markets. The checks do not test derivatives of the remainder; LA2_remainder_bounds.py does.
