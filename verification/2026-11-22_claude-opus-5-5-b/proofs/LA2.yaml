steps:
  - id: 1
    locator: 'Lemma A.2(a): y_{A,1}^N=(\alpha_{A,1}+\theta\alpha_{B,1})\zeta_{A,1}^N -\theta\alpha_{B,1}\zeta_{B,1}^N + O({\gamma^{-2}})'
    claim: The (u, v) remainders of the joint proof translate into the O(gamma^-2) inventory remainders of the statement.
    status: verified
    method: re-derivation
    note: >-
      My derivation. y_B = alpha_B s = alpha_B(mu + sigma - 2 sigma t), so y_B - alpha_B zeta^N_B = -2 sigma alpha_B (v - v^0)/(1 + gamma(1 - theta));
      y_A + theta y_B = (alpha_A + theta alpha_B) z, so y_A - claim_A = -2 sigma (alpha_A + theta alpha_B)(u - u^0)/gamma - theta (y_B - claim_B).
      With LA1 joint-proof steps 33-35 both are O_{C^2(p_1; P)}(gamma^-2) uniformly in theta, and O(gamma^-3) for fixed
      theta < 1. Check test_lemma_a2a_first_period_inventory_equilibrium_of_scenario_n observes order 2.00 at theta = 1 and
      2.7 to 3.0 at theta < 1; LA2_remainder_bounds.py gives the same picture with price derivatives.
  - id: 2
    locator: 'Lemma A.2(b): p^N_{i,2}(R^N_1)=\widehat p_{i,2}+O(\gamma^{-1})'
    claim: Part (b) follows from the Scenario N price-subgame paragraph for a fixed R_1 > 0.
    status: verified
    method: re-derivation
    note: LA1 steps 12-15 give uniqueness once gamma R_1 > 2M/beta and the expansion O(1/(gamma R_1)), which is O(1/gamma) for fixed R_1 > 0. The inventory sentence is LA1 step 1.
  - id: 3
    locator: 'theory.md LA2, Proof dependency line'
    claim: The joint proof bounds the first-period inventory remainders and their first two price derivatives by O(gamma^-2) on P, uniformly in theta in [0, 1]; P8 uses this.
    status: verified
    method: reading
    note: >-
      The editorial note is correct. The proof states that u - u^0 and v - v^0 'remain O_{C^2(p_1;P)}(gamma^-2)', the
      notation paragraph makes bounds uniform in p and theta unless specified otherwise, and step 1 transfers the bound
      to the inventory remainders. The derivation is checked in LA1 steps 32-35. P8 uses the first-derivative part only.
  - id: 4
    locator: 'When \gamma R_1 is bounded, compactness of the price set bounds both the static payoff and \gamma \nu_i R_1'
    claim: The uniform bound on V_i - gamma nu_i R_1, used to bound the first-period orders away from zero in Scenario N.
    status: gap
    method: re-derivation
    note: 'see: LA1/F1. The bound presupposes a (possibly mixed) second-period equilibrium at states with small gamma R_1; LA1 steps 17 and 20 give the repair (Glicksberg), which is all this part of LA2 needs.'
    repair: 'see: LA1/F1'
