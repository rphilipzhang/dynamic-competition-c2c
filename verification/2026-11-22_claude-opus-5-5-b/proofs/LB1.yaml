verdict: sound
paper_statement: holds_as_printed
confidence: high
restatement: >-
  Mixed scenario G: Z^G_{i,2} = gamma_{i,2} R_{i,1} + gammaC_{i,2} R_{j,1} with
  gamma_{i,2} = (lambda^S + lambda^N alpha_{i,2}) gamma, gammaC_{i,2} = lambda^N gamma alpha_{i,2},
  lambda^S, lambda^N in [0, 1], lambda^S + lambda^N = 1, gamma > 0. Assume A11 in both periods,
  I1, I2, theta in [0, 1], F as in A3 with X_t >= 0, rho = 1. (i) For every first-period sales
  state the second-period subgame has exactly one Nash equilibrium,
  y^G_{i,2} = y^0_{i,2} + gamma_{i,2} R_{i,1} + gammaC_{i,2} R_{j,1}. (ii) Given these continuation
  values, the first-period game has exactly one Nash equilibrium,
  y^G_{A,1} = (alpha_{A,1} + theta alpha_{B,1}) zeta^G_{A,1} - theta alpha_{B,1} zeta^G_{B,1},
  y^G_{B,1} = alpha_{B,1} zeta^G_{B,1}, with zeta^G_{A,1} = F^{-1}(1 - c_A/P_A),
  P_A = p_{A,1} + gamma_{A,2} (p_{A,2} - c_A), and zeta^G_{B,1} = F^{-1}(1 - [c_B - gammaC_{B,2} theta
  (p_{B,2} - c_B) c_A/P_A] / [p_{B,1} + (gamma_{B,2} - gammaC_{B,2} theta)(p_{B,2} - c_B)]), both
  arguments in (0, 1). So the feedback Nash equilibrium exists and is unique for every mix of the
  weights. Without A11 the printed closed form is in general not an equilibrium.
differences_checked:
  - difference: 1
    needed: true
    note: >-
      Case 2 of the definition of needed: the paper imposes A11 for the Exogenous Price Model in the
      opening paragraph of Section 4, and Section 4.2 introduces Online Appendix B as the
      equilibrium "for the Exogenous Price Model with both types of interactions present"; the
      lemma refers to y^0_{i,2} of Lemma 1, stated under A11. Online Appendix B does not restate
      the condition, so the statement read alone would be false without it. I tested the claim
      "without it the stated closed form is in general not an equilibrium" from the primitives
      (LB1_without_a11.py, uniform law on [2, 18], lambda^S = 0.5): with p_{A,1} = 1.3 below
      (c_A/c_B) p_{B,1} = 2.93 (c_A/P_A = 0.395 > c_B/P'_B = 0.271) the printed first-period orders
      (9.2267, 2.6108) admit a deviation gaining 0.303 (B's best response 3.699), confirmed by an
      independent quadrature, while the mirrored form (9.2786, 3.6678) is an equilibrium; with
      A11 failing only in period 2 (p_{A,2} = 1.4) the printed y^0_{i,2} + Z_{i,2} admits a gain of
      2.558 and the mirrored benchmark plus Z is an equilibrium. At a point where A11 fails
      (p_{A,t} > p_{B,t}) but both orderings still hold, the printed form is an equilibrium (gain
      1.4e-14), so "in general" is the right quantifier. Under A11 the ordering
      c_A/P_A <= c_B/P'_B holds for every mix, since gamma_{A,2} - gamma_{B,2} = lambda^N gamma
      (alpha_{A,2} - alpha_{B,2}) >= 0 (exact check at 4000 points with lambda^S in {0, 1, random}).
      The added hypothesis-line note on rho = 1 is correct: the formulas of Online Appendix B carry
      no rho. The difference is the only change at its place (token comparison of the run). The
      printed statement holds under the assumptions in force, so the paper statement holds as
      printed.
hypotheses_used: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A15, I1, I2, I3]
unstated_hypotheses: []
