  - "L2 proof: the shift argument of (A.4)"
steps:
  - id: 1
    locator: 'Let ybarbar_{A,2} := y_{A,2} - gamma_{A,2} R_{A,1} - gammaC_{A,2} R_{B,1} ... by analogous arguments in the proof of Lemma 3, we have the equilibrium order quantity ybarbar^G_{A,2} = y^0_{A,2}'
    claim: The second-period game in the shifted orders is the benchmark game; unique equilibrium y^0 + Z^G.
    status: verified
    method: re-derivation
    note: >-
      The demands are those of Section 3 with Z^G; subtracting Z^G_{i,2} gives the benchmark demand
      (L2 step 1). The hand-typed reference "Lemma 3" is correct (lem:modeln is 3 in the build).
      The second-period equilibrium needs A11 in period 2 for the form of y^0_{i,2} (difference 1).
  - id: 2
    locator: 'In the first period, by analogous arguments ...'
    claim: The continuation value pi^0_{i,2} + (p_{i,2} - c_i)(gamma_{i,2} R_{i,1} + gammaC_{i,2} R_{j,1}), used implicitly.
    status: verified
    method: re-derivation
    note: Not written in the proof; derived as in L2 step 5 and confirmed from the primitives at random states (repository check and my script, error 4.5e-16).
  - id: 3
    locator: 'retailer A''s best response is: If y_{B,1} <= alpha_{B,1} zeta^G_{A,1} ... the following equation, p_{A,1} -c_A + (p_{A,2} -c_A)gamma_{A,2} = [p_{A,1} + (p_{A,2} -c_A) (gamma_{A,2}- gammaC_{A,2} theta)] F(...) + (p_{A,2} -c_A)gammaC_{A,2} theta F(...)'
    claim: A's first-period best response in the two regions.
    status: verified
    method: numerical
    note: >-
      As L3 steps 3-9 with P_A = p_{A,1} + gamma_{A,2} m_A and K_A = gammaC_{A,2} theta m_A, derived by
      hand; P_A - K_A = p_{A,1} + m_A (gamma_{A,2} - gammaC_{A,2} theta) > 0 because
      gamma_{A,2} >= gammaC_{A,2}. The derivative formulas agree with finite differences of the
      payoff built from the demand system (scenario G in shared_foc_kink_ordering.py, max error
      6.1e-10 of the price).
  - id: 4
    locator: 'Retailer B''s best response is: If y_{A,1} < alpha_{A,1} F^{-1}(1- c_B/(p_{B,1} + gamma_{B,2} (p_{B,2} -c_B))) ...'
    claim: B's first-period best response.
    status: verified
    method: numerical
    note: Mirror image of step 3 with B's own fractile; derivative formulas checked by finite differences.
  - id: 5
    locator: 'By analogous arguments, the first-period order quantities satisfy y^G_{A,1}/alpha_{A,1} >= y^G_{B,1}/alpha_{B,1}'
    claim: No equilibrium lies in the region y_A/alpha_A < y_B/alpha_B.
    status: verified
    method: re-derivation
    note: >-
      Derivation mine. The argument of L3 steps 12-15 needs c_A/P_A <= c_B/P'_B with
      P'_B = p_{B,1} + gamma_{B,2} m_B; this follows from A11 (c_A p_{B,1} <= c_B p_{A,1},
      c_A m_B <= c_B m_A) and gamma_{A,2} >= gamma_{B,2} (from alpha_{A,2} >= alpha_{B,2}). The proof
      does not say where A11 enters; listed difference 1 makes it explicit. Exact check at 4000
      points.
  - id: 6
    locator: 'and are the solution to the system { ... }'
    claim: The first-order conditions in the remaining region, and their solution is the printed closed form.
    status: verified
    method: symbolic
    note: >-
      The proof does not invert the system; SymPy gives the printed zeta^G_{B,1} with
      K_B = gammaC_{B,2} theta m_B, P'_B = p_{B,1} + gamma_{B,2} m_B. Derivation mine that both
      arguments of F^{-1} lie in (0, 1) and that q^G_A >= q^G_B (uses gammaC_{B,2} theta m_B < P'_B),
      with equality only when lambda^S = 1 and A11 binds in both periods, where the two regions
      meet; the range and ordering are checked exactly at 4000 points including lambda^S at 0 and 1.
  - id: 7
    locator: 'Thus, we have proved Lemma B.1.'
    claim: Existence and uniqueness of the equilibrium for every mix of weights.
    status: verified
    method: re-derivation
    note: As L3 step 19.
