restatement: >-
  Scenario N (Z_{i,2} = alpha_{i,2} gamma R_1 with R_1 = R_{A,1} + R_{B,1}, gamma > 0), A11 in both
  periods, I1, I2, theta in [0, 1], F as in A3 with X_t >= 0, rho = 1. (i) For every first-period
  sales state the second-period subgame has exactly one Nash equilibrium,
  y^N_{i,2} = y^0_{i,2} + alpha_{i,2} gamma R_1. (ii) Given these continuation values, the
  first-period game has exactly one Nash equilibrium, y^N_{A,1} = (alpha_{A,1} + theta alpha_{B,1})
  zeta^N_{A,1} - theta alpha_{B,1} zeta^N_{B,1}, y^N_{B,1} = alpha_{B,1} zeta^N_{B,1}, with
  zeta^N_{A,1} = F^{-1}(1 - c_A/P_A), P_A = p_{A,1} + alpha_{A,2} gamma (p_{A,2} - c_A), and
  zeta^N_{B,1} = F^{-1}(1 - [c_B - alpha_{B,2} gamma theta (p_{B,2} - c_B) c_A/P_A] / [p_{B,1} +
  alpha_{B,2} gamma (1 - theta)(p_{B,2} - c_B)]); both arguments of F^{-1} lie in (0, 1). So the
  feedback Nash equilibrium exists and is unique. (iii) Its sales and total profits are the
  expressions at the end of the proof. The proof establishes the same for any rho in (0, 1].
