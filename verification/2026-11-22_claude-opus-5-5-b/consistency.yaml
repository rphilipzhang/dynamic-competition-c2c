    JSON to equal the stored files byte for byte (passed: 8 panels, 187 points). It tests what it names, the reproducibility
    of the stored data from the published files; the correctness of the extractor (its PostScript interpreter, legend
    decoding and axis calibration) is not tested by it. verification/2026-11-22_claude-opus-5-5-b/scripts/part1_eps_independent_extraction.py is a separate
