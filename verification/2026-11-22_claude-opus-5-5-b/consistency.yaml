- item: numerics omitted numerical statements
  compared_with: >-
    every sentence of both TeX files containing "numerical", "experiment", "we find", "robust", "test", "Figure",
    "shows that" and similar words, against the quotes of numerical_statements.yaml and the 16 results of theory.md
  method: script
  result: consistent_with_findings
  note: >-
    verification/2026-11-22_claude-opus-5-5-b/scripts/part1_quotations.py lists the uncovered sentences; most cite a proposition or are motivation. Two groups
    are numerical claims the file does not list (C2, C3). Both were checked and hold.
  findings:
  - id: C2
    severity: minor
    scope: numerics
    locator: >-
      Manuscript.tex:310 (Section 4.2.3): "However, when strong cross-brand C2C is present, we find that $\Pi^N_{A}$
      may decrease in $\theta$ when $\theta$ takes intermediate values."
    description: >-
      numerics/numerical_statements.yaml says that every numerical statement of the paper has an entry, but it omits
      this claim about the model. No proposition states it, theory.md does not list it, and no check tests it, so
      a verification driven by the repository never examines it.
    suggested_fix: >-
      Add an entry (e.g. N8) with a check that exhibits admissible markets with large gamma where Pi^N_A rises,
      falls on an interior interval of theta and rises again, or state in the file why the sentence is treated as
      discussion.
    evidence: >-
      verification/2026-11-22_claude-opus-5-5-b/scripts/part1_profit_n_a_nonmonotone.py: among 300 regular markets (A1, A11 strict, I1, I2, uniform demand),
      Pi^N_A from closed_form.npfta_t1 rises, falls on an interior interval and rises again at 3, 64, 85 and 51
      markets for gamma = 5, 50, 500, 5000 (e.g. a fall on [0.59, 0.91] at gamma = 50); it falls somewhere at 110,
      259, 294 and 300 markets. The claim holds.
  - id: C3
    severity: editorial
    scope: numerics
    locator: >-
      Manuscript.tex:68 (Introduction) "our numerical analysis shows that the qualitative comparisons of profits
      across scenarios largely persist even with pricing flexibility, provided that the strength of social interactions
      is not excessively large"; the Conclusion's "Our earlier profit-comparison patterns largely persist under
      endogenous pricing, although sufficiently strong C2C interactions may alter them"; Manuscript.tex:453 "Figure
      1(a)&(c) replicate the results in Propositions 5&6 under a moderate $\gamma$" (lead sentence of N2); OnlineAppendix.tex:515
      "Figure B.1 shows that our main results for the Exogenous Price Model still hold when both within-brand and
      cross-brand C2C are present" (lead sentence of N5)
    description: >-
      These summary or lead sentences state the broadest form of N2 to N5 and are not quoted. The checks of N2 to
      N5 test their substance in part (the crossings), but no entry records the claims of the Introduction and the
      Conclusion, or the "replicate"/"main results still hold" forms.
    suggested_fix: >-
      Extend the quotes of N2 and N5 to include their lead sentences, and list the Introduction and Conclusion summaries
      under N2 to N4 (or as one entry relying on their checks).
    evidence: >-
      All checked and supported. verification/2026-11-22_claude-opus-5-5-b/scripts/F1_fine_theta_grid.py and verification/2026-11-22_claude-opus-5-5-b/scripts/FB1_fine_theta_grid.py: panels (a), (c)
      of Figure 1 also show parts (a) of Propositions 5 and 6, and Figure B.1 shows analogues of Propositions 1(ii),
      2(b), 5(a), 5(b), 5(c2), 6(a), 6(b), 6(c2). verification/2026-11-22_claude-opus-5-5-b/scripts/N1_gamma_cost_sweep.py (Section 5.3 setting, gamma 0.1
      to 3.0): the crossing pattern appears for gamma <= 0.7 (retailer A, c_A = 0.1) and 0.4 <= gamma <= 0.7 (retailer
      B, c_A = 0.95), Scenario N dominates from gamma = 0.9 (A) and 1.5 (B), and Scenario S has two first-period
      equilibria at theta = 0 or 1 in between. For B at gamma <= 0.3 N dominates, but every equilibrium there is
      (4,4,4,4), i.e. the exogenous-price outcome, so the comparison "persists" in the paper's sense.
