- item: numerics c2c/primitives.py
  compared_with: >-
    Section 3 of paper/Manuscript.tex (demand split, C2C-induced demand of Scenarios S and N, the mixed scenario
    of Online Appendix B, stockout-based substitution, sales, period profits, timing)
  method: script
  result: consistent
  note: >-
    Read line by line and tested by verification/2026-11-22_claude-opus-5-5-b/scripts/part1_primitives_and_claimed_sec4.py. share is 1/2 + beta (p_j - p_i);
    sales implements M_i = alpha_i X + Z_i, D_i = M_i + theta (M_j - y_j)^+, R_i = min(D_i, y_i); c2c_demand implements
    Z^S_i = gamma R_i, Z^N_i = alpha_{i,2} gamma (R_A + R_B) and Z^G = lambda^S Z^S + lambda^N Z^N. These equal
    an exact rational transcription of Section 3 at 12000 (point, scenario) pairs (max difference 7.1e-15, floating
    point in the module), including y_i < Z_i and theta in {0, 1}. The expected sales of Uniform (trapezoid on the
    kinks, exact for piecewise-linear sales) and Quadrature (Gauss-Legendre between kinks and quantiles) agree with
    scipy quad to 1.8e-15. The module imports only numpy, scipy, dataclasses and __future__, so it uses no result
    of the paper. It has no period profit or discounting of its own: the period profit p R - c y and the two-period
    sum (with rho = 1, the normalisation of A10) are formed in section4.Game, whose period-2 payoffs take the sales
    state (R_{A,1}, R_{B,1}) as given (timing of Section 3.3, with R_{i,0} = 0 in period 1). section4.Game.period1_payoffs
    uses the continuation pi^0_{i,2} + (p_{i,2} - c_i) Z_{i,2}, which is the second-period claim of Lemmas 2, 3
