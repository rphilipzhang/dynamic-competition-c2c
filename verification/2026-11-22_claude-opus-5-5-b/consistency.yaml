    maps, colours mapped to scenarios from the rendered legends): it recovers all 17 series (187 points) and agrees
    with published_data.csv within 5.9e-7, with the recomputed Figure 1 values within 5.6e-5 (panels drawn from
    four-decimal data) and with the recomputed Figure B.1 values within 3.6e-6. The rendered panels (verification/2026-11-22_claude-opus-5-5-b/build/*-eps-converted-to.pdf)
